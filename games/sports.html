      "치료·교육 목적의 사용은 자유롭게 하실 수 있습니다.\n" +
      "제작자의 동의 없는 재배포·수정·상업적 이용을 금합니다."
  };

  /* ── 스타일 (otk- 접두사로 앱 CSS와 충돌 방지) ── */
  var pos = {
    "bottom-right":"bottom:14px; right:14px;",
    "bottom-left" :"bottom:14px; left:14px;",
    "top-right"   :"top:14px; right:14px;",
    "top-left"    :"top:14px; left:14px;"
  }[C.corner] || "bottom:14px; right:14px;";

  var css = document.createElement("style");
  css.textContent =
  '.otk-bar{position:fixed;'+pos+'z-index:2147483000;display:flex;gap:8px;'+
    'opacity:'+(C.dim?'0.18':'0.75')+';transition:opacity .2s;}'+
  '.otk-bar:hover,.otk-bar.otk-lit{opacity:1;}'+
  '.otk-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.45);'+
    'background:rgba(0,0,0,.55);color:#fff;font:900 18px/1 system-ui,sans-serif;'+
    'display:flex;align-items:center;justify-content:center;cursor:pointer;'+
    '-webkit-tap-highlight-color:transparent;padding:0;}'+
  '.otk-btn:active{background:rgba(255,255,0,.28);border-color:#FF0;color:#FF0;}'+
  '.otk-ov{position:fixed;inset:0;z-index:2147483001;background:#000;color:#fff;'+
    'display:none;overflow:auto;padding:5vh 6vw 6vh;'+
    'font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}'+
  '.otk-ov.otk-on{display:block;}'+
  '.otk-w{max-width:640px;margin:0 auto;}'+
  '.otk-w h2{color:#FF0;font-size:clamp(20px,5vw,30px);font-weight:900;'+
    'margin:0 0 3vh;text-align:center;}'+
  '.otk-r{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #222;'+
    'font-size:clamp(13px,3.4vw,17px);line-height:1.5;}'+
  '.otk-k{color:#888;font-weight:800;flex:0 0 34%;}'+
  '.otk-v{color:#fff;font-weight:800;flex:1;word-break:break-all;}'+
  '.otk-t{margin-top:3vh;padding:16px 18px;border:2px solid #333;border-radius:12px;'+
    'color:#bbb;font-size:clamp(12px,3vw,15px);font-weight:700;line-height:1.7;white-space:pre-line;}'+
  '.otk-c{margin-top:2vh;color:#666;text-align:center;'+
    'font-size:clamp(11px,2.7vw,14px);font-weight:700;}'+
  '.otk-x{display:block;width:100%;margin-top:4vh;padding:18px;border:0;border-radius:14px;'+
    'background:#222;color:#fff;font:900 clamp(16px,4vw,22px)/1 inherit;cursor:pointer;}';
  document.head.appendChild(css);

  /* ── 정보 화면 ── */
  var rows = [["앱 이름",C.app],["제작자",C.author],["소속",C.affil],
              ["연락처",C.contact],["버전",C.version],["배포본 번호",C.build]]
             .filter(function(r){return r[1];});
  var ov = document.createElement("div");
  ov.className = "otk-ov";
  ov.innerHTML =
    '<div class="otk-w"><h2>앱 정보</h2>' +
    rows.map(function(r){
      return '<div class="otk-r"><span class="otk-k">'+r[0]+
             '</span><span class="otk-v">'+r[1]+'</span></div>';}).join("") +
    '<div class="otk-t"></div><div class="otk-c"></div>' +
    '<button class="otk-x" type="button">닫기</button></div>';
  ov.querySelector(".otk-t").textContent = C.terms;
  ov.querySelector(".otk-c").textContent =
    "\u00A9 " + C.year + " " + C.author + ". All rights reserved.";

  /* ── 버튼 ── */
  var bar = document.createElement("div");
  bar.className = "otk-bar";

  var inIframe = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

  if (C.back === "auto") {
    var b = document.createElement("button");
    b.type = "button"; b.className = "otk-btn"; b.setAttribute("aria-label","뒤로");
    b.textContent = "\u2039";                 // ‹
    b.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      /* 런처 안이면 런처 홈으로, 단독 실행이면 앱 자체 첫 화면으로 */
      if (inIframe) { try{ parent.postMessage({__ot:"home"},"*"); }catch(e){} return; }
      if (typeof window.__OT_BACK__ === "function") { window.__OT_BACK__(); return; }
      if (history.length > 1) history.back();
    });
    bar.appendChild(b);
  }

  var i = document.createElement("button");
  i.type = "button"; i.className = "otk-btn"; i.setAttribute("aria-label","앱 정보");
  i.textContent = "i";
  i.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.add("otk-on");
  });
  bar.appendChild(i);

  ov.querySelector(".otk-x").addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.remove("otk-on");
  });

  function mount(){
    document.body.appendChild(bar);
    document.body.appendChild(ov);
  }
  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount);

  /* 반투명 모드에서 한 번 만지면 잠시 또렷해짐 */
  if (C.dim) {
    bar.addEventListener("pointerenter", function(){ bar.classList.add("otk-lit"); });
    bar.addEventListener("pointerdown",  function(){ bar.classList.add("otk-lit");
      setTimeout(function(){ bar.classList.remove("otk-lit"); }, 2500); });
  }
})();
</script>
</body>
</html>
