@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

:root {
  --bg: #FFF8F0;
  --primary: #6BAED6;
  --primary-dk: #4A8FBF;
  --easy: #A8D8A8;
  --easy-dk: #6BBF6B;
  --medium: #FFD580;
  --medium-dk: #E8A800;
  --hard: #FFB3A7;
  --hard-dk: #E07060;
  --text: #333;
  --text-sub: #777;
  --card-shadow: 0 4px 16px rgba(0,0,0,0.10);
  --radius: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  touch-action: none;
}

/* ── 화면 전환 ── */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ── 공통 버튼 ── */
.btn {
  border: none; cursor: pointer; border-radius: 50px;
  font-family: inherit; font-weight: 700; letter-spacing: -0.3px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: scale(0.96); box-shadow: none !important; }

.btn-start {
  background: var(--primary); color: #fff;
  font-size: clamp(20px, 4vw, 28px);
  padding: 18px 60px;
  box-shadow: 0 6px 20px rgba(107,174,214,0.5);
  margin-top: 32px;
}

.btn-back {
  background: rgba(0,0,0,0.07); border: none; cursor: pointer;
  width: 52px; height: 52px; border-radius: 50%;
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn-back:active { background: rgba(0,0,0,0.14); }

/* ── 홈 화면 ── */
.home-content {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
}
.home-logo { font-size: clamp(64px, 12vw, 100px); line-height: 1; }
.home-title {
  font-size: clamp(32px, 7vw, 56px); font-weight: 900;
  color: var(--primary-dk); margin-top: 8px;
}
.home-sub { font-size: clamp(16px, 3vw, 22px); color: var(--text-sub); margin-top: 4px; }

/* ── 공통 헤더 ── */
.screen-header {
  width: 100%; max-width: 800px;
  display: flex; align-items: center; gap: 16px;
  padding: 16px 24px 0;
}
.screen-header h2 {
  font-size: clamp(22px, 4vw, 32px); font-weight: 900; color: var(--primary-dk);
}

/* ── 모드 선택 ── */
#screen-mode { justify-content: flex-start; gap: 24px; }
.mode-grid {
  display: flex; gap: 20px; padding: 8px 24px;
  flex-wrap: wrap; justify-content: center;
}
.mode-card {
  width: clamp(160px, 40vw, 280px);
  background: #fff; border-radius: var(--radius);
  padding: 28px 20px; text-align: center;
  box-shadow: var(--card-shadow); cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 3px solid transparent;
}
.mode-card:active { transform: scale(0.97); }
.mode-card:hover { border-color: var(--primary); box-shadow: 0 6px 24px rgba(107,174,214,0.3); }
.mode-icon-big { font-size: clamp(32px, 6vw, 48px); margin-bottom: 12px; }
.mode-name { font-size: clamp(20px, 3.5vw, 26px); font-weight: 700; margin-bottom: 8px; }
.mode-desc { font-size: clamp(13px, 2vw, 16px); color: var(--text-sub); line-height: 1.6; }

/* ── 난이도 선택 ── */
#screen-difficulty { justify-content: flex-start; gap: 24px; }
.diff-grid {
  display: flex; gap: 16px; padding: 8px 24px;
  flex-wrap: wrap; justify-content: center;
}
.diff-card {
  width: clamp(140px, 28vw, 220px);
  border-radius: var(--radius); padding: 24px 16px; text-align: center;
  box-shadow: var(--card-shadow); cursor: pointer;
  transition: transform 0.15s;
}
.diff-card:active { transform: scale(0.97); }
.diff-easy  { background: var(--easy); }
.diff-medium { background: var(--medium); }
.diff-hard  { background: var(--hard); }
.diff-stars { font-size: clamp(22px, 4vw, 32px); margin-bottom: 10px; }
.diff-name  { font-size: clamp(20px, 3.5vw, 26px); font-weight: 700; margin-bottom: 8px; }
.diff-desc  { font-size: clamp(13px, 2vw, 15px); color: #444; line-height: 1.6; }

/* ── 게임 화면 ── */
#screen-game { justify-content: flex-start; padding: 0; }

.game-header {
  width: 100%; background: #fff;
  padding: 8px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  z-index: 10; flex-shrink: 0; min-height: 84px;
}
.btn-icon {
  background: #f0f0f0; border: none; cursor: pointer;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.btn-icon:active { background: #ddd; }

.game-target-box {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: #FFF3E0; border-radius: 12px;
  padding: 8px 14px; overflow: hidden;
}
.target-label { font-size: 14px; color: var(--text-sub); white-space: nowrap; }
.target-name  { font-size: clamp(18px, 3.5vw, 24px); font-weight: 700; color: var(--primary-dk); }
.target-canvas {
  width: 64px; height: 64px; flex-shrink: 0;
  border-radius: 12px;
  border: 3px solid var(--primary);
  background: #EBF5FF;
}

.game-status { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.score-badge {
  background: var(--primary); color: #fff;
  font-weight: 700; font-size: clamp(15px, 2.5vw, 18px);
  padding: 6px 14px; border-radius: 20px; white-space: nowrap;
}
.btn-hint {
  background: #FFF9C4; border: 2px solid #FFD600; cursor: pointer;
  padding: 6px 12px; border-radius: 20px;
  font-size: clamp(14px, 2.5vw, 17px); font-weight: 700;
  display: flex; align-items: center; gap: 4px;
  transition: transform 0.1s;
}
.btn-hint:active { transform: scale(0.95); }
.btn-hint.disabled { opacity: 0.4; pointer-events: none; }

.canvas-wrap {
  flex: 1; width: 100%; position: relative; overflow: hidden;
  background: #FAFAF8;
}
#game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.tap-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: rgba(255, 80, 80, 0.18);
  border-radius: 0;
  transition: opacity 0.25s;
}
.tap-flash.hidden { display: none; }

/* ── 결과 화면 ── */
.result-box {
  background: #fff; border-radius: 28px;
  padding: clamp(28px, 5vw, 48px) clamp(28px, 6vw, 60px);
  text-align: center; box-shadow: var(--card-shadow);
  margin: 16px;
}
.result-emoji { font-size: clamp(52px, 10vw, 80px); }
.result-title { font-size: clamp(24px, 5vw, 36px); font-weight: 900; margin: 12px 0 24px; color: var(--primary-dk); }
.result-stats { display: flex; gap: 20px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
.stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stat-val  { font-size: clamp(22px, 4vw, 30px); font-weight: 700; color: var(--text); }
.stat-lbl  { font-size: clamp(12px, 2vw, 15px); color: var(--text-sub); }
.result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.btn-replay {
  background: var(--primary); color: #fff;
  font-size: clamp(17px, 3vw, 22px); padding: 14px 36px;
  box-shadow: 0 4px 14px rgba(107,174,214,0.4);
}
.btn-menu {
  background: #f0f0f0; color: var(--text);
  font-size: clamp(17px, 3vw, 22px); padding: 14px 36px;
}

</style>

  <script>
// ─── 설정 ──────────────────────────────────────────────

const SHAPE_TYPES = [
  { id:'circle',   name:'원'     },
  { id:'square',   name:'사각형'  },
  { id:'triangle', name:'삼각형'  },
  { id:'star',     name:'별'     },
  { id:'diamond',  name:'마름모'  },
  { id:'pentagon', name:'오각형'  },
  { id:'heart',    name:'하트'   },
  { id:'cross',    name:'십자'   },
];

const OBJECT_TYPES = [
  { id:'apple',     name:'사과'      },
  { id:'car',       name:'자동차'    },
  { id:'house',     name:'집'        },
  { id:'fish',      name:'물고기'    },
  { id:'flower',    name:'꽃'        },
  { id:'tree',      name:'나무'      },
  { id:'butterfly', name:'나비'      },
  { id:'train',     name:'기차'      },
  { id:'cake',      name:'케이크'    },
  { id:'balloon',   name:'풍선'      },
  { id:'mushroom',  name:'버섯'      },
  { id:'rocket',    name:'로켓'      },
];

const FILLS   = ['#FFB3B3','#FFD4A3','#FFFAA3','#B3F0B3','#A3D4FF','#D4A3FF','#FFB3E6','#A3FFE8','#FFDDB3','#C8F0B3'];
const STROKES = ['#C03030','#A06000','#909000','#189018','#1050AA','#6010AA','#AA1070','#007060','#A07020','#508020'];

const DIFFICULTY = {
  easy:   { count:5,  targetRatio:0.4,  sizeMin:130, sizeMax:190, lineWidth:5.5, opacity:0.90, touchPad:22, hints:5 },
  medium: { count:8,  targetRatio:0.4,  sizeMin:100, sizeMax:155, lineWidth:4.0, opacity:0.82, touchPad:12, hints:3 },
  hard:   { count:12, targetRatio:0.35, sizeMin:80,  sizeMax:125, lineWidth:3.0, opacity:0.75, touchPad:6,  hints:1 },
};

// ─── 수학 유틸 ──────────────────────────────────────────
function rnd(a,b){ return a+Math.random()*(b-a); }
function rndInt(a,b){ return Math.floor(rnd(a,b+1)); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=rndInt(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

// ─── 히트 테스트 ────────────────────────────────────────
function crossSign(px,py,ax,ay,bx,by){ return (px-bx)*(ay-by)-(ax-bx)*(py-by); }
function ptInTri(px,py,a,b,c){
  const d1=crossSign(px,py,a.x,a.y,b.x,b.y),d2=crossSign(px,py,b.x,b.y,c.x,c.y),d3=crossSign(px,py,c.x,c.y,a.x,a.y);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
function ptInPoly(px,py,pts){
  let inside=false; const n=pts.length;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if((yi>py)!==(yj>py)&&px<((xj-xi)*(py-yi))/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
function starPts(n,outer,inner){
  const p=[];
  for(let i=0;i<n*2;i++){const r=i%2===0?outer:inner,a=(i/(n*2))*Math.PI*2-Math.PI/2; p.push({x:r*Math.cos(a),y:r*Math.sin(a)});}
  return p;
}
function polyPts(n,r,start){ const p=[]; for(let i=0;i<n;i++){const a=start+(i/n)*Math.PI*2; p.push({x:r*Math.cos(a),y:r*Math.sin(a)});} return p; }

function shapeHitTest(typeId, size, lx, ly){
  const r=size/2;
  switch(typeId){
    case 'circle':   return lx*lx+ly*ly<=r*r;
    case 'square':   return Math.abs(lx)<=r&&Math.abs(ly)<=r;
    case 'triangle': return ptInTri(lx,ly,{x:0,y:-r},{x:r*.866,y:r*.5},{x:-r*.866,y:r*.5});
    case 'star':     return ptInPoly(lx,ly,starPts(5,r,r*.40));
    case 'diamond':  return ptInPoly(lx,ly,[{x:0,y:-r},{x:r*.65,y:0},{x:0,y:r},{x:-r*.65,y:0}]);
    case 'pentagon': return ptInPoly(lx,ly,polyPts(5,r,-Math.PI/2));
    case 'heart':    return lx*lx+ly*ly<=r*r; // approximate
    case 'cross':    return (Math.abs(lx)<=r*0.35&&Math.abs(ly)<=r)||(Math.abs(lx)<=r&&Math.abs(ly)<=r*0.35);
    default:         return lx*lx+ly*ly<=r*r;
  }
}
function objectHitTest(size,lx,ly){ const r=size/2; return lx*lx+ly*ly<=r*r; }

// ─── 도형 경로 (shapes mode) ────────────────────────────
function buildShapePath(ctx, typeId, size){
  const r=size/2;
  ctx.beginPath();
  switch(typeId){
    case 'circle':   ctx.arc(0,0,r,0,Math.PI*2); break;
    case 'square':   ctx.rect(-r,-r,size,size); break;
    case 'triangle': ctx.moveTo(0,-r);ctx.lineTo(r*.866,r*.5);ctx.lineTo(-r*.866,r*.5);ctx.closePath(); break;
    case 'star': { const p=starPts(5,r,r*.40); p.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();break; }
    case 'diamond':  ctx.moveTo(0,-r);ctx.lineTo(r*.65,0);ctx.lineTo(0,r);ctx.lineTo(-r*.65,0);ctx.closePath();break;
    case 'pentagon': { const p=polyPts(5,r,-Math.PI/2); p.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();break; }
    case 'heart': {
      const s=r*0.9;
      ctx.moveTo(0,s*0.35);
      ctx.bezierCurveTo(-s*1.1,-s*0.50,-s*1.10,-s*1.20, 0,-s*0.42);
      ctx.bezierCurveTo( s*1.1,-s*1.20, s*1.10,-s*0.50, 0, s*0.35);
      break;
    }
    case 'cross': {
      const a=r*0.34,b=r;
      ctx.moveTo(-a,-b);ctx.lineTo(a,-b);ctx.lineTo(a,-a);ctx.lineTo(b,-a);
      ctx.lineTo(b,a);ctx.lineTo(a,a);ctx.lineTo(a,b);ctx.lineTo(-a,b);
      ctx.lineTo(-a,a);ctx.lineTo(-b,a);ctx.lineTo(-b,-a);ctx.lineTo(-a,-a);
      ctx.closePath();break;
    }
  }
}

// ─── 공통 드로잉 헬퍼 ───────────────────────────────────
function fs(ctx,fill,stroke,lw){ ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke(); }

// ─── 사물 그리기 함수 12종 ─────────────────────────────

function _apple(ctx,r,fill,stroke,lw){
  // 줄기
  ctx.save(); ctx.beginPath();
  ctx.moveTo(r*.06,-r*.68); ctx.quadraticCurveTo(r*.30,-r*1.10,r*.08,-r*.93);
  ctx.strokeStyle='#795548'; ctx.lineWidth=Math.max(2.5,lw*.9); ctx.lineCap='round'; ctx.stroke(); ctx.restore();
  // 잎
  ctx.save(); ctx.translate(r*.20,-r*.86); ctx.rotate(-0.44);
  const lr=r*.32;

// ─── drawObj 디스패처 ────────────────────────────────────
const OBJ_FN = {
  apple:_apple, car:_car, house:_house, fish:_fish, flower:_flower, tree:_tree,
  butterfly:_butterfly, train:_train, cake:_cake, balloon:_balloon, mushroom:_mushroom, rocket:_rocket
};

function drawObj(ctx, typeId, size, fill, stroke, lw){
  const r=size/2;
  ctx.save();
  ctx.lineJoin='round'; ctx.lineCap='round';
  const fn=OBJ_FN[typeId];
  if(fn) fn(ctx,r,fill,stroke,lw);
  ctx.restore();
}

// ─── 게임 엔진 ──────────────────────────────────────────
const Game=(()=>{
  let canvas,ctx,wrap,state=null,animFrame=null,paused=false,wrongFlashTimer=null;

  function init(){
    canvas=document.getElementById('game-canvas');
    ctx=canvas.getContext('2d');
    wrap=document.getElementById('canvas-wrap');
    canvas.addEventListener('pointerdown',onTap);
    window.addEventListener('resize',onResize);
  }

  function start(mode,difficulty){
    if(!mode||!difficulty) return;
    const cfg=DIFFICULTY[difficulty];
    const types=mode==='shapes'?SHAPE_TYPES:OBJECT_TYPES;
    const targetType=types[rndInt(0,types.length-1)];
    onResize();
    const W=canvas.logW,H=canvas.logH;
    const shapes=generateShapes(mode,cfg,types,targetType,W,H);
    const targetCount=shapes.filter(s=>s.isTarget).length;
    state={mode,difficulty,cfg,shapes,targetType,targetCount,foundCount:0,wrongTaps:0,totalTaps:0,
           hintsLeft:cfg.hints,hintsUsed:0,hintUntil:0,wrongAt:0,wrongPos:null,startTime:Date.now(),complete:false};
    updateHUD(); drawTargetPreview(); renderLoop();
  }

  function generateShapes(mode,cfg,types,targetType,W,H){
    const shapes=[];
    const n=cfg.count;
    const tc=Math.max(2,Math.round(n*cfg.targetRatio));
    const dc=n-tc;
    const cols=Math.ceil(Math.sqrt(n*(W/H)));
    const rows=Math.ceil(n/cols);
    const cw=W/cols,ch=H/rows;
    const cells=[];
    for(let row=0;row<rows;row++) for(let col=0;col<cols;col++) cells.push({cx:cw*(col+.5),cy:ch*(row+.5)});
    shuffle(cells);
    function make(idx,typeId,isTarget){
      const cell=cells[idx]||{cx:rnd(80,W-80),cy:rnd(80,H-80)};
      const size=rnd(cfg.sizeMin,cfg.sizeMax);
      const ci=rndInt(0,FILLS.length-1);
      return{id:idx,typeId,isTarget,
        x:Math.max(size/2+10,Math.min(W-size/2-10,cell.cx+rnd(-cw*.28,cw*.28))),
        y:Math.max(size/2+10,Math.min(H-size/2-10,cell.cy+rnd(-ch*.28,ch*.28))),
        size,rotation:rnd(-Math.PI/5,Math.PI/5),fill:FILLS[ci],stroke:STROKES[ci],
        opacity:cfg.opacity,found:false,foundAt:0};
    }
    for(let i=0;i<tc;i++) shapes.push(make(i,targetType.id,true));
    const dt=types.filter(t=>t.id!==targetType.id);
    for(let i=0;i<dc;i++) shapes.push(make(tc+i,dt[rndInt(0,dt.length-1)].id,false));
    shuffle(shapes); return shapes;
  }

  function drawTargetPreview(){
    const cvs=document.getElementById('target-canvas');
    if(!cvs||!state) return;
    const dpr=window.devicePixelRatio||1;
    const W=cvs.clientWidth||64,H=cvs.clientHeight||64;
    cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
    const tc=cvs.getContext('2d');
    tc.scale(dpr,dpr); tc.clearRect(0,0,W,H);
    const size=Math.min(W,H)*.76;
    const fill='#A3CFFF',stroke='#1060CC',lw=Math.max(2,size*.04);
    tc.save(); tc.translate(W/2,H/2); tc.lineJoin='round';
    if(state.mode==='shapes'){
      buildShapePath(tc,state.targetType.id,size);
      tc.fillStyle=fill;tc.fill();tc.strokeStyle=stroke;tc.lineWidth=lw;tc.stroke();
    } else {
      drawObj(tc,state.targetType.id,size,fill,stroke,lw);
    }
    tc.restore();
  }

  function renderLoop(){ if(animFrame) cancelAnimationFrame(animFrame); paused=false; animFrame=requestAnimationFrame(render); }

  function render(ts){
    if(!state||paused) return;
    animFrame=requestAnimationFrame(render);
    const W=canvas.logW,H=canvas.logH;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#F8F8F5';ctx.fillRect(0,0,W,H);
    const now=ts||performance.now();
    const hintActive=now<state.hintUntil;
    state.shapes.forEach(s=>s.found?drawFoundShape(s,now):drawShapeOnCanvas(s,hintActive&&s.isTarget));
    if(state.wrongPos&&now<state.wrongAt+450){
      const p=(now-state.wrongAt)/450;
      ctx.save();ctx.globalAlpha=.55*(1-p);
      ctx.beginPath();ctx.arc(state.wrongPos.x,state.wrongPos.y,34+p*38,0,Math.PI*2);
      ctx.fillStyle='#FF4040';ctx.fill();ctx.restore();
    }
    if(state.complete){cancelAnimationFrame(animFrame);animFrame=null;}
  }

  function drawShapeOnCanvas(s,hintHighlight){
    ctx.save();ctx.globalAlpha=s.opacity;ctx.translate(s.x,s.y);ctx.rotate(s.rotation);ctx.lineJoin='round';
    if(state.mode==='shapes'){
      buildShapePath(ctx,s.typeId,s.size);
      ctx.fillStyle=s.fill;ctx.fill();ctx.strokeStyle=s.stroke;ctx.lineWidth=state.cfg.lineWidth;ctx.stroke();
    } else {
      drawObj(ctx,s.typeId,s.size,s.fill,s.stroke,state.cfg.lineWidth);
    }
    ctx.restore();
    if(hintHighlight){
      const pulse=.6+.4*Math.sin(performance.now()*.006);
      ctx.save();ctx.globalAlpha=.90*pulse;ctx.translate(s.x,s.y);ctx.rotate(s.rotation);
      ctx.beginPath();ctx.arc(0,0,s.size/2+14,0,Math.PI*2);
      ctx.strokeStyle='#FFD600';ctx.lineWidth=7;ctx.stroke();ctx.restore();
    }
  }

  function drawFoundShape(s,now){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rotation);
    ctx.globalAlpha=s.opacity*.42;ctx.lineJoin='round';
    if(state.mode==='shapes'){buildShapePath(ctx,s.typeId,s.size);ctx.fillStyle=s.fill;ctx.fill();}
    else drawObj(ctx,s.typeId,s.size,s.fill,s.stroke,state.cfg.lineWidth);
    const e=Math.min(1,(now-s.foundAt)/380);
    ctx.globalAlpha=1-e*.32;
    ctx.beginPath();ctx.arc(0,0,s.size/2+4+e*14,0,Math.PI*2);
    ctx.strokeStyle='#43A047';ctx.lineWidth=5;ctx.stroke();
    ctx.globalAlpha=e;
    ctx.font=`bold ${Math.round(s.size*.52)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#2E7D32';ctx.fillText('✓',0,0);
    ctx.restore();
  }

  function onTap(e){
    e.preventDefault();
    if(!state||state.complete) return;
    const rect=canvas.getBoundingClientRect();
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    let hit=null;
    for(let i=state.shapes.length-1;i>=0;i--){
      const s=state.shapes[i];
      if(s.found) continue;
      if(hitTest(s,px,py)){hit=s;break;}
    }
    state.totalTaps++;
    if(hit&&hit.isTarget){
      hit.found=true;hit.foundAt=performance.now();state.foundCount++;
      Audio.correct();updateHUD();
      if(state.foundCount>=state.targetCount){state.complete=true;setTimeout(onComplete,650);}
    } else {
      state.wrongTaps++;state.wrongAt=performance.now();state.wrongPos={x:px,y:py};
      Audio.wrong();flashScreen();
    }
  }

  function hitTest(s,px,py){
    const cos=Math.cos(-s.rotation),sin=Math.sin(-s.rotation);
    const dx=px-s.x,dy=py-s.y;
    const lx=dx*cos-dy*sin,ly=dx*sin+dy*cos;
    const pad=state.cfg.touchPad;
    return state.mode==='shapes'?shapeHitTest(s.typeId,s.size+pad*2,lx,ly):objectHitTest(s.size+pad*2,lx,ly);
  }

  function flashScreen(){ const el=document.getElementById('tap-flash'); el.classList.remove('hidden'); clearTimeout(wrongFlashTimer); wrongFlashTimer=setTimeout(()=>el.classList.add('hidden'),220); }
  function showHint(){ if(!state||state.hintsLeft<=0) return; state.hintsLeft--;state.hintsUsed++;state.hintUntil=performance.now()+2000;Audio.hint();updateHUD(); }
  function updateHUD(){
    if(!state) return;
    document.getElementById('score-badge').textContent=`${state.foundCount} / ${state.targetCount}`;
    document.getElementById('hint-count').textContent=state.hintsLeft;
    document.getElementById('target-name').textContent=state.targetType.name;
    document.getElementById('btn-hint').classList.toggle('disabled',state.hintsLeft<=0);
  }

  function onComplete(){
    Audio.complete();
    const elapsed=Math.round((Date.now()-state.startTime)/1000);
    const accuracy=state.totalTaps>0?Math.round((state.targetCount/state.totalTaps)*100):100;
    const perfect=state.hintsUsed===0&&state.wrongTaps===0;
    document.getElementById('stat-time').textContent=elapsed+'초';
    document.getElementById('stat-hints').textContent=state.hintsUsed+'번';
    document.getElementById('stat-accuracy').textContent=accuracy+'%';
    document.getElementById('result-emoji').textContent=perfect?'🏆':'🎉';
    document.getElementById('result-title').textContent=perfect?'완벽해요!':'잘했어요!';
    App.showScreen('result');
  }

  function onResize(){
    if(!canvas||!wrap) return;
    const dpr=window.devicePixelRatio||1;
    const W=wrap.clientWidth||window.innerWidth;
    const H=wrap.clientHeight||(window.innerHeight-84);
    if(W<10||H<10) return;
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    canvas.logW=W;canvas.logH=H;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function getState(){ return state; }
  function pause(){ paused=true; }
  function resume(){ if(state&&!state.complete) renderLoop(); }
  return{init,start,showHint,getState,pause,resume};
})();

// ─── 오디오 ────────────────────────────────────────────
const Audio=(()=>{
  let actx=null;
  function getCtx(){ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
  function tone(freq,dur,type='sine',vol=.26){ try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start(c.currentTime);o.stop(c.currentTime+dur);}catch(_){} }
  return{
    correct(){ tone(523,.12);setTimeout(()=>tone(659,.12),90);setTimeout(()=>tone(784,.22),180); },
    wrong(){ tone(200,.25,'sine',.16); },
    complete(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.28),i*140)); },
    hint(){ tone(880,.08);setTimeout(()=>tone(880,.08),130); },
  };
})();

</script>

// ─── 화면 전환 ──────────────────────────────────────────

const App = (() => {
  let currentMode = null;
  let currentDiff = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('screen-' + id);
    if (el) el.classList.add('active');
  }

  function init() {
    Game.init();

    // 홈
    document.getElementById('btn-start').addEventListener('click', () => showScreen('mode'));

    // 모드 선택
    document.getElementById('mode-back').addEventListener('click', () => showScreen('home'));
    document.getElementById('mode-shapes').addEventListener('click', () => {
      currentMode = 'shapes';
      showScreen('difficulty');
    });
    document.getElementById('mode-objects').addEventListener('click', () => {
      currentMode = 'objects';
      showScreen('difficulty');
    });

    // 난이도 선택
    document.getElementById('diff-back').addEventListener('click', () => showScreen('mode'));
    ['easy', 'medium', 'hard'].forEach(d => {
      document.getElementById('diff-' + d).addEventListener('click', () => {
        currentDiff = d;
        startGame();
      });
    });

    // 게임 화면
    document.getElementById('game-exit').addEventListener('click', () => {
      showScreen('mode');
    });
    document.getElementById('btn-hint').addEventListener('click', () => {
      Game.showHint();
    });

    // 결과 화면
    document.getElementById('btn-replay').addEventListener('click', () => {
      startGame();
    });
    document.getElementById('btn-menu').addEventListener('click', () => {
      showScreen('mode');
    });
  }

  function startGame() {
    if (!currentMode || !currentDiff) return;
    const m = currentMode, d = currentDiff;
    showScreen('game');
    // 레이아웃 확정 후 시작
    setTimeout(() => Game.start(m, d), 60);
  }

  return { init, showScreen };
})();

  var bar = document.createElement("div");
  bar.className = "otk-bar";

  var inIframe = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

  if (C.back === "auto") {
    var b = document.createElement("button");
    b.type = "button"; b.className = "otk-btn"; b.setAttribute("aria-label","뒤로");
    b.textContent = "\u2039";                 // ‹
    b.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      /* 런처 안이면 런처 홈으로, 단독 실행이면 앱 자체 첫 화면으로 */
      if (inIframe) { try{ parent.postMessage({__ot:"home"},"*"); }catch(e){} return; }
      if (typeof window.__OT_BACK__ === "function") { window.__OT_BACK__(); return; }
      if (history.length > 1) history.back();
    });
    bar.appendChild(b);
  }

  var i = document.createElement("button");
  i.type = "button"; i.className = "otk-btn"; i.setAttribute("aria-label","앱 정보");
  i.textContent = "i";
  i.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.add("otk-on");
  });
  bar.appendChild(i);

  ov.querySelector(".otk-x").addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.remove("otk-on");
  });

  function mount(){
    document.body.appendChild(bar);
    document.body.appendChild(ov);
  }
  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount);

  /* 반투명 모드에서 한 번 만지면 잠시 또렷해짐 */
  if (C.dim) {
    bar.addEventListener("pointerenter", function(){ bar.classList.add("otk-lit"); });
    bar.addEventListener("pointerdown",  function(){ bar.classList.add("otk-lit");
      setTimeout(function(){ bar.classList.remove("otk-lit"); }, 2500); });
  }
})();
</script>
</body>
</html>
