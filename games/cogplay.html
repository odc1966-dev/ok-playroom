<style>

html,body{height:100%}
body{
  font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;
  background:var(--cream); color:var(--ink);
  display:flex; flex-direction:column; align-items:center;
}

#app{width:100%; max-width:760px; padding:16px 16px 40px; flex:1}

.brand{display:flex; align-items:center; gap:10px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--teal);

.brand h1{font-size:24px;color:var(--teal-deep);letter-spacing:.5px}
.brand small{display:block;font-size:12px;color:var(--ink-soft);font-family:'Gowun Dodum'}
.topbtns{display:flex;gap:8px}
.chipbtn{border:2px solid var(--teal); background:#fff; color:var(--teal-deep);
  border-radius:999px; padding:8px 14px; font-size:15px; font-family:'Jua'; cursor:pointer}
.chipbtn:active{transform:scale(.96)}
.chipbtn.solid{background:var(--teal);color:#fff}

/* ---------- home ---------- */
.hello{background:linear-gradient(135deg,var(--teal) 0%,var(--teal-light) 100%);
  color:#fff;border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);

.hello h2{font-size:22px;margin-bottom:4px}
.hello p{font-size:14px;opacity:.92}
.hello .stampmini{font-size:30px;background:rgba(255,255,255,.18);border-radius:16px;padding:8px 14px;white-space:nowrap}
.domain{margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.domain h3{font-size:19px;color:var(--teal-deep)}
.domain .tag{font-size:12px;color:#fff;background:var(--teal-light);border-radius:999px;padding:3px 10px;font-family:'Jua'}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gamecard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:3px solid transparent;padding:18px;cursor:pointer;text-align:left;
  display:flex;gap:14px;align-items:center;transition:transform .12s}
.gamecard:active{transform:scale(.97)}
.gamecard:hover{border-color:var(--sand)}
.gamecard .gicon{font-size:38px;width:62px;height:62px;border-radius:18px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gamecard h4{font-family:'Jua';font-size:17px;margin-bottom:3px}
.gamecard p{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.lvlrow{display:flex;gap:3px;margin-top:6px}
.lvldot{width:10px;height:10px;border-radius:50%;background:#E3E9EB}
.lvldot.on{background:var(--coral)}

/* ---------- game screen ---------- */
.gamehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.backbtn{border:none;background:#fff;box-shadow:var(--shadow);border-radius:14px;
  padding:10px 16px;font-size:15px;font-family:'Jua';color:var(--ink-soft);cursor:pointer}
.gametitle{font-size:20px;color:var(--teal-deep)}
.lvlbadge{font-family:'Jua';font-size:14px;color:#fff;background:var(--coral);border-radius:999px;padding:6px 13px}
.progress{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.pdot{width:16px;height:16px;border-radius:50%;background:#E3E9EB;transition:background .2s}
.pdot.now{background:var(--sand);outline:3px solid var(--coral)}
.pdot.hit{background:var(--ok)}
.pdot.miss{background:var(--coral)}
.prompt{font-family:'Jua';font-size:clamp(20px,4.5vw,26px);text-align:center;margin:14px 0;color:var(--ink);line-height:1.4}
.prompt .big{font-size:clamp(34px,8vw,52px);display:inline-block;margin:0 6px}
.stage{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

/* option buttons / grids */

.cell{border:none;background:var(--cream);border-radius:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,7vw,46px); aspect-ratio:1; transition:transform .1s, background .15s;
  border:3px solid #EFE7D8}
.cell:active{transform:scale(.93)}
.cell.flash{background:var(--sand);border-color:var(--coral)}
.cell.picked{background:#D7F0E6;border-color:var(--ok)}
.cell.wrongpick{background:#FCE1DE;border-color:var(--coral)}
.wordopt{font-size:clamp(30px,7vw,46px)}
.answord{font-family:'Jua';font-size:clamp(38px,9vw,58px);color:var(--teal-deep);
  background:var(--cream);border:3px dashed var(--teal-light);border-radius:20px;padding:14px 34px;margin-bottom:8px}
.ttsbtn{border:none;background:var(--teal);color:#fff;border-radius:50%;width:52px;height:52px;
  font-size:24px;cursor:pointer;margin-left:10px;vertical-align:middle}
.numopt{font-family:'Jua';font-size:clamp(26px,6vw,38px);aspect-ratio:auto;padding:16px 0}
.mathline{font-family:'Jua';font-size:clamp(30px,7vw,44px);text-align:center;margin-bottom:20px;letter-spacing:2px}
.mathline .emojirow{font-size:clamp(26px,6vw,40px);letter-spacing:0}

/* cups */

.cup{position:absolute;top:40px;width:90px;height:110px;cursor:pointer;transition:left .45s ease, transform .3s;
  display:flex;flex-direction:column;align-items:center;font-size:76px;line-height:1}
.cup .ball{font-size:34px;height:40px;visibility:hidden}
.cup.lift{transform:translateY(-46px)}
.cup.showball .ball{visibility:visible}
@media (prefers-reduced-motion: reduce){ .cup{transition:none} .cell{transition:none} }

/* feedback overlay */

.fb.show{opacity:1}
.fb.good{background:rgba(47,169,124,.16);color:var(--ok)}
.fb.bad{background:rgba(240,113,103,.16);color:var(--coral)}

  padding:34px 24px;text-align:center;margin-top:20px}

/* report */

.bars{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.barrow{display:grid;grid-template-columns:86px 1fr 62px;align-items:center;gap:10px;margin:12px 0}
.barrow .lbl{font-family:'Jua';font-size:15px}
.bartrack{background:var(--cream);border-radius:999px;height:22px;overflow:hidden}
.barfill{height:100%;background:linear-gradient(90deg,var(--teal-light),var(--teal));border-radius:999px;
  transition:width .6s ease; min-width:4px}
.barrow .val{font-family:'Jua';font-size:15px;color:var(--teal-deep);text-align:right}
.sesstable{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);

.sesstable th{background:var(--teal);color:#fff;padding:10px 8px;font-family:'Jua';font-weight:400}
.sesstable td{padding:9px 8px;text-align:center;border-top:1px solid #F0EBE0}
.stampboard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);

.empty-report{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:15px}

/* name modal */

.modal .box{background:#fff;border-radius:var(--radius);padding:30px;width:min(92vw,380px);text-align:center}
.modal h3{font-size:20px;color:var(--teal-deep);margin-bottom:14px}
.modal input{width:100%;border:2px solid var(--teal-light);border-radius:14px;padding:12px 14px;
  font-size:17px;font-family:inherit;text-align:center;margin-bottom:16px}

/* profiles & settings (v2) */

.profbox{text-align:left}
.profbox h3{text-align:center}
.proflist{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;margin-bottom:14px}
.profrow{display:flex;gap:8px;align-items:stretch}
.profrow .profpick{flex:1;border:2px solid #E3E9EB;background:var(--cream);border-radius:14px;

.profmeta{float:right;font-size:12px;color:var(--ink-soft)}
.profrow .profdel{border:none;background:#fff;border:2px solid #F0D9D6;border-radius:14px;
  padding:0 12px;cursor:pointer;font-size:15px;color:var(--coral);font-family:'Jua'}
.profadd{display:flex;gap:8px}
.profadd input{flex:1;border:2px solid var(--teal-light);border-radius:14px;padding:10px 12px;
  font-size:16px;font-family:inherit;margin-bottom:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0;border-bottom:1px solid #F0EBE0}
.setrow:last-child{border-bottom:none}
.setlbl{font-family:'Jua';font-size:15px}
.seggroup{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:2px solid #E3E9EB;background:#fff;border-radius:999px;padding:7px 14px;
  font-family:'Jua';font-size:14px;color:var(--ink-soft);cursor:pointer}
.seg.on{border-color:var(--teal);background:var(--teal);color:#fff}
.mainbtn.danger{background:#fff;color:var(--coral);border:2px solid var(--coral)}
.databox .rowbtns{justify-content:flex-start}

/* PLUS: speak / trace / trend */
.speakhead{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.speakpic{font-size:clamp(70px,16vw,110px);line-height:1}
.speakhint{font-family:'Jua';font-size:20px;color:var(--ink-soft)}
.speakhint b{color:var(--coral);font-size:26px}
.readtext{font-family:'Jua';font-size:clamp(26px,6vw,40px);color:var(--teal-deep);
  background:var(--cream);border:3px dashed var(--teal-light);border-radius:20px;padding:14px 26px}
.micbtn{border:none;background:var(--coral);color:#fff;font-family:'Jua';font-size:19px;
  border-radius:999px;padding:16px 30px;cursor:pointer;box-shadow:var(--shadow);margin-top:14px}
.micbtn:disabled{opacity:.85}
.micbtn:active{transform:scale(.96)}
.micnote{font-size:13.5px;color:var(--ink-soft);margin-top:12px;text-align:center}
.tracewrap{position:relative;max-width:100%;border:3px solid #EFE7D8;border-radius:18px;background:#fff;overflow:hidden}
.tracecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tracecv.ink{cursor:crosshair}
.trendbox .todayline{font-size:15px;text-align:center;margin-bottom:10px}
.trendbox .todayline b{color:var(--teal-deep);font-family:'Jua'}
.trendsvg{width:100%;height:auto;display:block}
.trendsvg .grid{stroke:#EDE7DA;stroke-width:1}
.trendsvg .trendline{fill:none;stroke:var(--teal);stroke-width:3;stroke-linejoin:round}
.trendsvg .trenddot{fill:var(--coral)}
.trendsvg .ylbl{font-size:10px;fill:var(--ink-soft);text-anchor:end}

button:focus-visible,.cell:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

<body>
<div id="app" role="main"></div>

<!-- ==================== PURE GAME LOGIC (no DOM) ==================== -->
<script id="logic">
/* @logic-start */
const CP = (() => {
  const rndDefault = Math.random;

  function shuffle(arr, rnd = rndDefault) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pickN(arr, n, rnd = rndDefault) { return shuffle(arr, rnd).slice(0, n); }
  function randInt(min, max, rnd = rndDefault) { return min + Math.floor(rnd() * (max - min + 1)); }

  /* ---------- data ---------- */
  const EMOJI_POOL = ['🍎','🍌','🍇','🍓','🍉','🥕','🌽','🍞','🐶','🐱','🐰','🐻','🐸','🐟','🐤','🦋','🚗','🚌','✈️','🚲','⚽','🎈','🎁','☂️','👟','🧢','🌙','⭐','🌸','🌳','🏠','🔔'];

  // visually similar pairs for odd-one-out (base vs odd)
  const SIMILAR_PAIRS = [
    ['😀','😃'],['🐶','🐺'],['🐱','🐯'],['🍊','🍑'],['⚽','🏐'],
    ['🌸','💮'],['🐢','🐊'],['🚗','🚙'],['⭐','🌟'],['🍩','🥯'],
    ['🐤','🐥'],['🌙','🌛'],['🥛','🍶'],['🧢','👒'],['🐟','🐠']
  ];

  // word ↔ picture items with category for semantic-distractor levels
  const WORD_ITEMS = [
    {w:'사과',e:'🍎',c:'과일'},{w:'바나나',e:'🍌',c:'과일'},{w:'포도',e:'🍇',c:'과일'},
    {w:'딸기',e:'🍓',c:'과일'},{w:'수박',e:'🍉',c:'과일'},{w:'귤',e:'🍊',c:'과일'},
    {w:'강아지',e:'🐶',c:'동물'},{w:'고양이',e:'🐱',c:'동물'},{w:'토끼',e:'🐰',c:'동물'},
    {w:'곰',e:'🐻',c:'동물'},{w:'개구리',e:'🐸',c:'동물'},{w:'물고기',e:'🐟',c:'동물'},
    {w:'병아리',e:'🐤',c:'동물'},{w:'나비',e:'🦋',c:'동물'},
    {w:'자동차',e:'🚗',c:'탈것'},{w:'버스',e:'🚌',c:'탈것'},{w:'비행기',e:'✈️',c:'탈것'},
    {w:'자전거',e:'🚲',c:'탈것'},{w:'배',e:'⛵',c:'탈것'},{w:'기차',e:'🚆',c:'탈것'},
    {w:'공',e:'⚽',c:'물건'},{w:'풍선',e:'🎈',c:'물건'},{w:'선물',e:'🎁',c:'물건'},
    {w:'우산',e:'☂️',c:'물건'},{w:'신발',e:'👟',c:'물건'},{w:'모자',e:'🧢',c:'물건'},
    {w:'시계',e:'⏰',c:'물건'},{w:'가위',e:'✂️',c:'물건'},
    {w:'달',e:'🌙',c:'자연'},{w:'별',e:'⭐',c:'자연'},{w:'꽃',e:'🌸',c:'자연'},
    {w:'나무',e:'🌳',c:'자연'},{w:'해',e:'☀️',c:'자연'},{w:'비',e:'🌧️',c:'자연'},
    {w:'집',e:'🏠',c:'장소'},{w:'학교',e:'🏫',c:'장소'},{w:'병원',e:'🏥',c:'장소'}
  ];

  /* ---------- generators (one trial each) ---------- */

  // 1) 같은 그림 찾기 — one target among distractors
  function genFindSame(level, rnd = rndDefault) {
    const size = level === 1 ? 3 : level === 2 ? 4 : 5;
    const n = size * size;
    let target, distractor;
    if (level >= 3) {
      [target, distractor] = shuffle(SIMILAR_PAIRS[randInt(0, SIMILAR_PAIRS.length - 1, rnd)], rnd);
    } else {
      const two = pickN(EMOJI_POOL, 2, rnd);
      target = two[0]; distractor = two[1];
    }
    const answerIndex = randInt(0, n - 1, rnd);
    const grid = Array.from({length: n}, (_, i) => (i === answerIndex ? target : distractor));
    return { size, target, grid, answerIndex };
  }

  // 2) 종이컵 공 찾기 — swaps list; returns final ball position
  function genCups(level, rnd = rndDefault) {
    const cups = level === 1 ? 3 : level === 2 ? 4 : 5;
    const nSwaps = level === 1 ? 4 : level === 2 ? 6 : 8;
    const speed = level === 1 ? 650 : level === 2 ? 480 : 360; // ms per swap
    const ballStart = randInt(0, cups - 1, rnd);
    const swaps = [];
    let ball = ballStart;
    for (let s = 0; s < nSwaps; s++) {
      let i = randInt(0, cups - 1, rnd), j = randInt(0, cups - 1, rnd);
      while (j === i) j = randInt(0, cups - 1, rnd);
      swaps.push([i, j]);
      if (ball === i) ball = j; else if (ball === j) ball = i;
    }
    return { cups, ballStart, swaps, speed, answerIndex: ball };
  }

  // 3) 그림 기억하기 — memorize K pictures, then pick the seen one among 4
  function genRememberPics(level, rnd = rndDefault) {
    const k = level === 1 ? 2 : level === 2 ? 3 : 4;
    const pool = pickN(EMOJI_POOL, k + 3, rnd);
    const shown = pool.slice(0, k);
    const distractors = pool.slice(k, k + 3);
    const answer = shown[randInt(0, k - 1, rnd)];
    const options = shuffle([answer, ...distractors], rnd);
    return { shown, options, answerIndex: options.indexOf(answer), showMs: 2600 };
  }

  // 4) 순서 기억하기 — grid sequence to repeat
  function genSequence(level, rnd = rndDefault) {
    const gridSize = level <= 2 ? 2 : 3;                    // 2x2 or 3x3
    const len = level === 1 ? 3 : level === 2 ? 4 : 5;
    const n = gridSize * gridSize;
    const seq = [];
    let prev = -1;
    for (let i = 0; i < len; i++) {
      let c = randInt(0, n - 1, rnd);
      while (c === prev) c = randInt(0, n - 1, rnd);        // avoid immediate repeats
      seq.push(c); prev = c;
    }
    return { gridSize, seq, flashMs: level === 3 ? 520 : 650 };
  }

  // 5) 다른 그림 찾기 — odd one out with similar pair
  function genOddOne(level, rnd = rndDefault) {
    const size = level === 1 ? 3 : level === 2 ? 4 : 5;
    const n = size * size;
    const pair = SIMILAR_PAIRS[randInt(0, SIMILAR_PAIRS.length - 1, rnd)];
    const [base, odd] = shuffle(pair, rnd);
    const answerIndex = randInt(0, n - 1, rnd);
    const grid = Array.from({length: n}, (_, i) => (i === answerIndex ? odd : base));
    return { size, grid, answerIndex };
  }

  // 6) 같은 위치 누르기 — remember highlighted positions
  function genPositions(level, rnd = rndDefault) {
    const gridSize = level === 3 ? 4 : 3;
    const count = level === 1 ? 2 : 3;
    const n = gridSize * gridSize;
    const targets = pickN(Array.from({length: n}, (_, i) => i), count, rnd);
    return { gridSize, targets, showMs: 2400 };
  }

  // 7) 단어 읽고 그림 찾기
  function genWordPicture(level, rnd = rndDefault) {
    const item = WORD_ITEMS[randInt(0, WORD_ITEMS.length - 1, rnd)];
    const nOpts = level === 3 ? 6 : 4;
    let pool;
    if (level >= 2) { // semantically close distractors first
      const same = WORD_ITEMS.filter(x => x.c === item.c && x.w !== item.w);
      const other = WORD_ITEMS.filter(x => x.c !== item.c);
      pool = shuffle(same, rnd).concat(shuffle(other, rnd));
    } else {
      pool = shuffle(WORD_ITEMS.filter(x => x.c !== item.c), rnd);
    }
    const distractors = pool.slice(0, nOpts - 1);
    const options = shuffle([item, ...distractors], rnd);
    return { word: item.w, options, answerIndex: options.findIndex(o => o.w === item.w) };
  }

  // 8) 계산하기
  function genMath(level, rnd = rndDefault) {
    let display, answer, emoji = null;
    if (level === 1) {                       // counting addition with pictures
      const a = randInt(1, 4, rnd), b = randInt(1, 4, rnd);
      emoji = EMOJI_POOL[randInt(0, 7, rnd)];
      answer = a + b;
      display = { type: 'emoji', a, b, emoji };
    } else if (level === 2) {                // plain +/− within 20
      const plus = rnd() < 0.5;
      let a = randInt(2, 15, rnd), b = randInt(1, 9, rnd);
      if (!plus && b > a) [a, b] = [b, a];
      answer = plus ? a + b : a - b;
      display = { type: 'text', text: `${a} ${plus ? '+' : '−'} ${b} = ?` };
    } else {                                 // missing operand
      const a = randInt(2, 12, rnd), b = randInt(1, 9, rnd);
      const c = a + b;
      answer = b;
      display = { type: 'text', text: `${a} + ？ = ${c}` };
    }
    const opts = new Set([answer]);
    while (opts.size < 4) {
      const d = answer + randInt(-3, 3, rnd);
      if (d >= 0 && d !== answer) opts.add(d);
    }
    const options = shuffle([...opts], rnd);
    return { display, answer, options, answerIndex: options.indexOf(answer) };
  }

  /* ---------- adaptive difficulty ---------- */
  // returns new level from session accuracy (5 trials)
  function nextLevel(level, correct, total) {
    const acc = correct / total;
    if (acc >= 0.8 && level < 3) return level + 1;
    if (acc <= 0.4 && level > 1) return level - 1;
    return level;
  }

  /* ---------- PLUS: 말하기 (voice) ---------- */
  const SENTENCES = [
    '사과를 먹어요','강아지가 뛰어요','버스를 타요','꽃이 피었어요','공을 던져요',
    '우유를 마셔요','학교에 가요','비가 와요','문을 열어요','손을 씻어요',
    '별이 반짝여요','신발을 신어요','책을 읽어요','노래를 불러요','풍선이 날아가요'
  ];
  function normalizeSpeech(s){ return String(s||'').replace(/[^0-9a-zA-Z가-힣]/g,''); }
  function matchSpeech(target, transcript){
    const t = normalizeSpeech(target), u = normalizeSpeech(transcript);
    if(!t || !u) return false;
    return u.includes(t);
  }
  // level 1: naming with first-syllable hint · 2: naming, no hint · 3: read a sentence aloud
  function genSpeak(level, rnd = rndDefault){
    if(level >= 3){
      const text = SENTENCES[randInt(0, SENTENCES.length - 1, rnd)];
      return { mode:'reading', text };
    }
    const item = WORD_ITEMS[randInt(0, WORD_ITEMS.length - 1, rnd)];
    return { mode:'naming', word:item.w, emoji:item.e,
      hint: level === 1 ? item.w[0] : null };
  }

  /* ---------- PLUS: 쓰기 (handwriting tracing) ---------- */
  const TRACE_L1 = ['가','나','도','수','오','1','2','3','5','7'];
  function genTrace(level, rnd = rndDefault){
    if(level === 1) return { text: TRACE_L1[randInt(0, TRACE_L1.length - 1, rnd)] };
    const pool = WORD_ITEMS.filter(x => level === 2 ? x.w.length === 2 : x.w.length >= 3);
    return { text: pool[randInt(0, pool.length - 1, rnd)].w };
  }
  // two-pass box dilation of a binary mask (Uint8Array), radius r
  function dilate(mask, w, h, r){
    const tmp = new Uint8Array(w*h), out = new Uint8Array(w*h);
    for(let y=0; y<h; y++) for(let x=0; x<w; x++){   // horizontal
      if(!mask[y*w+x]) continue;
      const x0=Math.max(0,x-r), x1=Math.min(w-1,x+r);
      for(let k=x0;k<=x1;k++) tmp[y*w+k]=1;
    }
    for(let x=0; x<w; x++) for(let y=0; y<h; y++){ // vertical
      if(!tmp[y*w+x]) continue;
      const y0=Math.max(0,y-r), y1=Math.min(h-1,y+r);
      for(let k=y0;k<=y1;k++) out[k*w+x]=1;
    }
    return out;
  }
  // score user ink against glyph template. pass = enough of glyph covered AND ink stays near glyph
  function scoreTrace(templateMask, inkMask, w, h, r = 8){
    let tCount=0, iCount=0;
    for(let i=0;i<w*h;i++){ if(templateMask[i]) tCount++; if(inkMask[i]) iCount++; }
    if(!tCount) return { coverage:0, precision:0, pass:false };
    if(!iCount) return { coverage:0, precision:0, pass:false };
    const inkD = dilate(inkMask, w, h, r);
    const tmplD = dilate(templateMask, w, h, r);
    let cov=0, prec=0;
    for(let i=0;i<w*h;i++){
      if(templateMask[i] && inkD[i]) cov++;
      if(inkMask[i] && tmplD[i]) prec++;
    }
    const coverage = cov/tCount, precision = prec/iCount;
    return { coverage, precision, pass: coverage >= 0.5 && precision >= 0.55 };
  }

  /* ---------- PLUS: daily report ---------- */
  function dailySummary(records){
    const map = {};
    for(const r of records){
      const day = String(r.date).slice(0,10);
      if(!map[day]) map[day] = { correct:0, total:0, sessions:0 };
      map[day].correct += r.correct; map[day].total += r.total; map[day].sessions += 1;
    }
    return Object.keys(map).sort().map(day => ({
      day, sessions: map[day].sessions,
      accuracy: map[day].total ? Math.round(map[day].correct / map[day].total * 100) : 0
    }));
  }

  /* ---------- report helpers ---------- */
  function domainSummary(records) {
    const map = {};
    for (const r of records) {
      if (!map[r.domain]) map[r.domain] = { correct: 0, total: 0, timeSum: 0, timeN: 0, sessions: 0 };
      const m = map[r.domain];
      m.correct += r.correct; m.total += r.total; m.sessions += 1;
      if (r.avgTime != null) { m.timeSum += r.avgTime; m.timeN += 1; }
    }
    const out = {};
    for (const d in map) {
      const m = map[d];
      out[d] = {
        accuracy: m.total ? Math.round((m.correct / m.total) * 100) : 0,
        avgTime: m.timeN ? Math.round(m.timeSum / m.timeN) / 1000 : null,
        sessions: m.sessions
      };
    }
    return out;
  }

  function toCSV(records) {
    const head = ['일시','영역','게임','난이도','정답수','문항수','정확도(%)','평균반응(초)'];
    const rows = records.map(r => [
      r.date, r.domain, r.game, r.level, r.correct, r.total,
      Math.round(r.correct / r.total * 100),
      r.avgTime != null ? (r.avgTime / 1000).toFixed(1) : ''
    ]);
    return '\uFEFF' + [head, ...rows].map(row => row.join(',')).join('\n');
  }

  return { shuffle, pickN, randInt, EMOJI_POOL, SIMILAR_PAIRS, WORD_ITEMS, SENTENCES, TRACE_L1,
    genFindSame, genCups, genRememberPics, genSequence, genOddOne,
    genPositions, genWordPicture, genMath, genSpeak, genTrace,
    normalizeSpeech, matchSpeech, dilate, scoreTrace, dailySummary,
    nextLevel, domainSummary, toCSV };
})();
if (typeof module !== 'undefined') module.exports = CP;
/* @logic-end */
</script>

<!-- ==================== APP (DOM) ==================== -->
<script id="appjs">
(function(){
'use strict';
const $app = document.getElementById('app');
const STORE_KEY = 'cogplay_v1';
const DEFAULT_SETTINGS = { trials:5, sound:true, showScale:1, autoLevel:true };

/* ---------- profiles & persistent state ---------- */
function newProfile(name){
  return { id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4), name,
    created:Date.now(), levels:{}, records:[], settings:{...DEFAULT_SETTINGS} };
}
const state = { profiles:[], currentId:null };
let storageOk = false;

function normalize(){
  if(!state.profiles.length) state.profiles.push(newProfile('사용자 1'));
  if(!state.profiles.find(p=>p.id===state.currentId)) state.currentId = state.profiles[0].id;
  state.profiles.forEach(p=>{
    p.settings = {...DEFAULT_SETTINGS, ...(p.settings||{})};
    p.levels = p.levels||{}; p.records = p.records||[];
  });
}
function loadState(){
  try{
    const raw = window.localStorage.getItem(STORE_KEY);
    storageOk = true;
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.profiles)){ state.profiles = d.profiles; state.currentId = d.currentId; }
    }
  }catch(e){ storageOk = false; }
  normalize();
}
function saveState(){
  try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; }
  catch(e){ storageOk = false; }
}
const profile  = ()=> state.profiles.find(p=>p.id===state.currentId);
const settings = ()=> profile().settings;
const lvlOf    = id => profile().levels[id] || 1;
const storageNote = ()=> storageOk
  ? '기록과 설정은 이 기기에 자동 저장돼요.'
  : '이 환경에서는 자동 저장이 지원되지 않아요. 리포트에서 CSV/JSON으로 내보내 보관하세요.';

/* ---------- game catalog ---------- */
const GAMES = [
  {id:'findSame',  domain:'주의력', icon:'🔍', name:'같은 그림 찾기',
   desc:'위의 그림과 똑같은 그림을 찾아 눌러요.', gen:CP.genFindSame},
  {id:'cups',      domain:'주의력', icon:'🥤', name:'컵 속의 공 찾기',
   desc:'공이 들어간 컵을 눈으로 끝까지 따라가요.', gen:CP.genCups},
  {id:'remember',  domain:'기억력', icon:'🧠', name:'그림 기억하기',
   desc:'잠깐 보여준 그림을 기억했다가 찾아요.', gen:CP.genRememberPics},
  {id:'sequence',  domain:'기억력', icon:'🔢', name:'순서 기억하기',
   desc:'불이 들어온 순서를 그대로 따라 눌러요.', gen:CP.genSequence},
  {id:'oddOne',    domain:'시지각', icon:'👀', name:'다른 그림 찾기',
   desc:'비슷한 그림 사이에서 다른 하나를 찾아요.', gen:CP.genOddOne},
  {id:'positions', domain:'시지각', icon:'🟦', name:'같은 위치 누르기',
   desc:'색이 칠해졌던 자리를 기억해서 눌러요.', gen:CP.genPositions},
  {id:'wordPic',   domain:'언어',   icon:'📖', name:'단어 읽고 그림 찾기',
   desc:'단어를 읽고(들어보고) 알맞은 그림을 골라요.', gen:CP.genWordPicture},
  {id:'math',      domain:'계산',   icon:'➕', name:'계산하기',
   desc:'그림을 세거나 식을 보고 답을 골라요.', gen:CP.genMath},
  {id:'speak',     domain:'말하기', icon:'🎤', name:'보고 말하기',
   desc:'그림 이름을 말하거나 문장을 소리 내어 읽어요. 음성으로 자동 채점해요.', gen:CP.genSpeak},
  {id:'trace',     domain:'쓰기',   icon:'✍️', name:'따라 쓰기',

];
const DOMAINS = ['주의력','기억력','시지각','언어','계산','말하기','쓰기'];
const DOMAIN_ICON = {'주의력':'🎯','기억력':'🧠','시지각':'👀','언어':'📖','계산':'➕','말하기':'🎤','쓰기':'✍️'};

/* ---------- audio & tts ---------- */
let audioCtx = null;
function beep(good){
  if(!settings().sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = good ? 740 : 220;
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }catch(e){/* audio unavailable */}
}
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){/* tts unavailable */}
}

/* ---------- helpers ---------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function download(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ==================== HOME ==================== */

function renderHome(){
  const p = profile();
  $app.innerHTML = '';
  $app.append(el(`
    <div>
      <div class="topbar">
        <div class="brand">
          <div class="logo">🧩</div>

        </div>
        <div class="topbtns">
          <button class="chipbtn" id="btnProfiles">👤 ${esc(p.name)}</button>

      </div>
      <div class="hello">
        <div>
          <h2>${esc(p.name)} 님, 안녕하세요!</h2>
          <p>오늘도 한 게임씩, 천천히 해 볼까요?</p>
        </div>
        <div class="stampmini" title="완료한 훈련 수">🏅 ${p.records.length}</div>
      </div>
      <div id="domains"></div>
      <p class="storenote">${storageNote()}</p>

  const $d = $app.querySelector('#domains');
  for (const dom of DOMAINS){
    $d.append(el(`<div class="domain"><span style="font-size:22px">${DOMAIN_ICON[dom]}</span><h3>${dom}</h3><span class="tag">훈련 영역</span></div>`));
    const grid = el(`<div class="gamegrid"></div>`);
    for (const g of GAMES.filter(x=>x.domain===dom)){
      const lv = lvlOf(g.id);
      const card = el(`
        <button class="gamecard" aria-label="${g.name} 시작">
          <div class="gicon">${g.icon}</div>
          <div>
            <h4>${g.name}</h4><p>${g.desc}</p>
            <div class="lvlrow" title="현재 난이도 ${lv}단계">
              ${[1,2,3].map(i=>`<span class="lvldot ${i<=lv?'on':''}"></span>`).join('')}
            </div>
          </div>
        </button>`);
      card.addEventListener('click', ()=>startSession(g));
      grid.append(card);
    }
    $d.append(grid);
  }
  $app.querySelector('#btnReport').addEventListener('click', renderReport);
  $app.querySelector('#btnSettings').addEventListener('click', renderSettings);
  $app.querySelector('#btnProfiles').addEventListener('click', openProfiles);
}

/* ==================== PROFILE MANAGER ==================== */

function openProfiles(){
  const m = el(`<div class="modal"><div class="box profbox">
    <h3>누가 훈련할까요?</h3>
    <div class="proflist" id="plist"></div>
    <div class="profadd">
      <input id="newName" maxlength="12" placeholder="새 이름 (예: 지우)">
      <button class="mainbtn" id="addBtn">추가</button>
    </div>
    <button class="mainbtn ghost" id="closeBtn" style="margin-top:12px">닫기</button>
  </div></div>`);
  document.body.append(m);

  const draw = ()=>{
    const $l = m.querySelector('#plist'); $l.innerHTML='';
    state.profiles.forEach(p=>{
      const row = el(`<div class="profrow ${p.id===state.currentId?'sel':''}">
        <button class="profpick">${p.id===state.currentId?'✅':'👤'} <b>${esc(p.name)}</b>
          <span class="profmeta">기록 ${p.records.length}회</span></button>
        <button class="profdel" title="프로필 삭제" aria-label="${esc(p.name)} 삭제">🗑️</button>
      </div>`);
      row.querySelector('.profpick').addEventListener('click', ()=>{
        state.currentId = p.id; saveState(); m.remove(); renderHome();
      });
      const del = row.querySelector('.profdel');
      del.addEventListener('click', ()=>{
        if(state.profiles.length<=1){ del.textContent='1명은 필요해요'; setTimeout(()=>del.textContent='🗑️',1200); return; }
        if(del.dataset.arm){ 
          state.profiles = state.profiles.filter(x=>x.id!==p.id);
          normalize(); saveState(); draw();
        } else { del.dataset.arm='1'; del.textContent='정말요?'; setTimeout(()=>{delete del.dataset.arm; del.textContent='🗑️';},1600); }
      });
      $l.append(row);
    });
  };
  draw();
  const add = ()=>{
    const name = m.querySelector('#newName').value.trim();
    if(!name) return;
    const p = newProfile(name);
    state.profiles.push(p); state.currentId = p.id; saveState();
    m.remove(); renderHome();
  };
  m.querySelector('#addBtn').addEventListener('click', add);
  m.querySelector('#newName').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
  m.querySelector('#closeBtn').addEventListener('click', ()=>m.remove());
}

/* ==================== SETTINGS ==================== */

function segRow(label, options, current, onPick){
  const row = el(`<div class="setrow"><span class="setlbl">${label}</span><div class="seggroup"></div></div>`);
  const g = row.querySelector('.seggroup');
  options.forEach(([val, txt])=>{
    const b = el(`<button class="seg ${val===current?'on':''}">${txt}</button>`);
    b.addEventListener('click', ()=>{ onPick(val); [...g.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); });
    g.append(b);
  });
  return row;
}

  wrap.append(box1);

  wrap.append(el(`<h2>게임별 시작 난이도</h2>`));
  const box2 = el(`<div class="bars"></div>`);

      v=>{ p.levels[g.id]=v; saveState(); }));

  wrap.append(el(`<h2>데이터 관리</h2>`));
  const box3 = el(`<div class="bars databox">
    <div class="rowbtns">
      <button class="mainbtn" id="backupBtn">⬇️ 전체 백업 (JSON)</button>

  </div>`);
  wrap.append(box3);

  box3.querySelector('#backupBtn').addEventListener('click', ()=>
    download(`코그플레이_백업_${Date.now()}.json`,
      JSON.stringify({app:'cogplay', version:2, exported:fmtDate(new Date()),
        profiles:state.profiles, currentId:state.currentId}, null, 2),
      'application/json'));

  const fileInput = box3.querySelector('#importFile');
  box3.querySelector('#importBtn').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(Array.isArray(d.profiles)){                       // full backup (v2)
          state.profiles = d.profiles; state.currentId = d.currentId;
          normalize(); saveState();
          msg(`가져오기 완료: 프로필 ${state.profiles.length}명을 불러왔어요.`);
        } else if(Array.isArray(d.records)){                 // old single-user export (v1)
          const p2 = newProfile(d.user || '가져온 기록');
          p2.records = d.records;
          state.profiles.push(p2); state.currentId = p2.id;
          normalize(); saveState();
          msg(`가져오기 완료: '${p2.name}' 프로필로 기록 ${p2.records.length}건을 불러왔어요.`);
        } else msg('가져올 수 없는 파일이에요. 코그플레이에서 저장한 JSON인지 확인해 주세요.');
      }catch(e){ msg('파일을 읽지 못했어요. JSON 형식인지 확인해 주세요.'); }
      renderSettingsSoft();
    };
    r.readAsText(f);
    function renderSettingsSoft(){ const keep = box3.querySelector('#dataMsg').textContent; renderSettings(); $app.querySelector('#dataMsg').textContent = keep; }
  });

  const resetBtn = box3.querySelector('#resetBtn');
  resetBtn.addEventListener('click', ()=>{
    if(resetBtn.dataset.arm){
      state.profiles = []; state.currentId = null; normalize(); saveState(); renderSettings();
    } else {
      resetBtn.dataset.arm='1'; resetBtn.textContent='정말 모두 지울까요?';
      setTimeout(()=>{ delete resetBtn.dataset.arm; resetBtn.textContent='전체 초기화'; }, 2200);
    }
  });
}

/* ==================== SESSION ENGINE ==================== */

function startSession(game){
  const session = { game, level: lvlOf(game.id), trials: settings().trials,
    trial:0, correct:0, times:[], results:[] };
  runTrial(session);
}

function sessionShell(session){
  const { game, level, trial, results, trials } = session;
  $app.innerHTML='';
  $app.append(el(`
    <div>
      <div class="gamehead">
        <button class="backbtn" id="btnBack">← 그만하기</button>
        <h2 class="gametitle display">${game.icon} ${game.name}</h2>
        <span class="lvlbadge">${level}단계</span>
      </div>
      <div class="progress">${Array.from({length:trials},(_,i)=>{
        let c='pdot'; if(i<results.length) c+= results[i]?' hit':' miss'; else if(i===trial) c+=' now';
        return `<span class="${c}"></span>`;}).join('')}
      </div>
      <div class="prompt" id="prompt"></div>
      <div class="stage" id="stage"><div class="fb" id="fb"></div></div>
    </div>`));
  $app.querySelector('#btnBack').addEventListener('click', renderHome);
  return { $prompt:$app.querySelector('#prompt'), $stage:$app.querySelector('#stage'), $fb:$app.querySelector('#fb') };
}

function finishTrial(session, ui, isCorrect, ms){
  session.results.push(isCorrect);
  if(isCorrect) session.correct++;
  if(ms!=null) session.times.push(ms);
  beep(isCorrect);
  ui.$fb.textContent = isCorrect ? '⭕' : '❌';
  ui.$fb.className = 'fb show ' + (isCorrect?'good':'bad');
  ui.$stage.style.pointerEvents='none';
  setTimeout(()=>{
    session.trial++;
    if(session.trial >= session.trials) finishSession(session);
    else runTrial(session);
  }, 900);
}

function finishSession(session){
  const { game, level, correct, times, trials } = session;
  const avgTime = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : null;
  const p = profile();
  p.records.push({
    date: fmtDate(new Date()), gameId: game.id, game: game.name, domain: game.domain,
    level, correct, total: trials, avgTime
  });
  let lvlMsg;
  if(settings().autoLevel){
    const newLv = CP.nextLevel(level, correct, trials);
    p.levels[game.id] = newLv;
    lvlMsg = newLv>level ? `🎉 아주 잘했어요! 다음엔 ${newLv}단계에 도전해요!`
          : newLv<level ? `괜찮아요, ${newLv}단계로 차근차근 다시 해 봐요.`
          : '좋아요! 같은 단계로 한 번 더 연습해요.';
  } else {
    lvlMsg = `지금은 ${level}단계 고정이에요. 설정에서 바꿀 수 있어요.`;
  }
  saveState();
  const acc = correct/trials;
  const stars = acc>=0.8?'⭐⭐⭐':acc>=0.6?'⭐⭐':correct>0?'⭐':'💪';
  $app.innerHTML='';
  $app.append(el(`
    <div class="resultcard">
      <h2>${game.icon} ${game.name} 끝!</h2>
      <div class="stars">${stars}</div>
      <div class="bigstat">
        <div><b>${correct} / ${trials}</b><span>정답</span></div>
        <div><b>${avgTime!=null?(avgTime/1000).toFixed(1)+'초':'—'}</b><span>평균 반응</span></div>
      </div>
      <div class="lvlmsg">${lvlMsg}</div>
      <div class="rowbtns">
        <button class="mainbtn" id="btnAgain">한 번 더</button>
        <button class="mainbtn ghost" id="btnHome">홈으로</button>
        <button class="mainbtn ghost" id="btnRep">📊 리포트</button>
      </div>
    </div>`));
  $app.querySelector('#btnAgain').addEventListener('click', ()=>startSession(game));
  $app.querySelector('#btnHome').addEventListener('click', renderHome);
  $app.querySelector('#btnRep').addEventListener('click', renderReport);
}

/* ==================== TRIAL RENDERERS ==================== */

function runTrial(session){
  const ui = sessionShell(session);
  const t = session.game.gen(session.level);
  RENDER[session.game.id](session, ui, t);
}

function cellSizeFor(cols){ return `grid-template-columns:repeat(${cols}, minmax(56px, 96px));`; }

function makeGrid(ui, items, cols, onPick){
  const g = el(`<div class="optgrid" style="${cellSizeFor(cols)}"></div>`);
  items.forEach((it,i)=>{
    const c = el(`<button class="cell" data-i="${i}">${it}</button>`);
    c.addEventListener('click', ()=>onPick(i,c));
    g.append(c);
  });
  ui.$stage.append(g);
  return g;
}

const RENDER = {

  findSame(session, ui, t){
    ui.$prompt.innerHTML = `이것과 <b>같은 그림</b>을 찾아요 <span class="big">${t.target}</span>`;
    const start = performance.now();
    makeGrid(ui, t.grid, t.size, (i,c)=>{
      c.classList.add(i===t.answerIndex?'picked':'wrongpick');
      finishTrial(session, ui, i===t.answerIndex, performance.now()-start);
    });
  },

  oddOne(session, ui, t){
    ui.$prompt.innerHTML = `<b>다른 그림 하나</b>를 찾아요`;
    const start = performance.now();
    makeGrid(ui, t.grid, t.size, (i,c)=>{
      c.classList.add(i===t.answerIndex?'picked':'wrongpick');
      finishTrial(session, ui, i===t.answerIndex, performance.now()-start);
    });
  },

  remember(session, ui, t){
    ui.$prompt.innerHTML = `그림을 <b>잘 기억하세요!</b>`;
    const show = el(`<div style="font-size:clamp(44px,10vw,68px);letter-spacing:14px">${t.shown.join('')}</div>`);
    ui.$stage.append(show);
    setTimeout(()=>{
      show.remove();
      ui.$prompt.innerHTML = `방금 본 그림은 <b>무엇이었나요?</b>`;
      const start = performance.now();
      makeGrid(ui, t.options, 2, (i,c)=>{
        c.classList.add(i===t.answerIndex?'picked':'wrongpick');
        finishTrial(session, ui, i===t.answerIndex, performance.now()-start);
      });
    }, t.showMs * settings().showScale);
  },

  positions(session, ui, t){
    ui.$prompt.innerHTML = `색칠된 <b>자리를 기억하세요!</b>`;
    const n = t.gridSize*t.gridSize;
    const g = makeGrid(ui, Array(n).fill(''), t.gridSize, ()=>{});
    t.targets.forEach(i=>g.children[i].classList.add('flash'));
    g.style.pointerEvents='none';
    setTimeout(()=>{
      [...g.children].forEach(c=>c.classList.remove('flash'));
      g.style.pointerEvents='';
      ui.$prompt.innerHTML = `색칠됐던 자리를 <b>모두 눌러요</b> (${t.targets.length}개)`;
      const start = performance.now();
      const picked = new Set(); let wrong = false;
      [...g.children].forEach((c,i)=>{
        c.onclick = ()=>{
          if(picked.has(i)) return;
          picked.add(i);
          if(t.targets.includes(i)) c.classList.add('picked');
          else { c.classList.add('wrongpick'); wrong = true; }
          if(picked.size >= t.targets.length){
            const allHit = !wrong && t.targets.every(x=>picked.has(x));
            finishTrial(session, ui, allHit, performance.now()-start);
          }
        };
      });
    }, t.showMs * settings().showScale);
  },

  sequence(session, ui, t){
    ui.$prompt.innerHTML = `불이 켜지는 <b>순서를 보세요!</b>`;
    const n = t.gridSize*t.gridSize;
    const g = makeGrid(ui, Array(n).fill(''), t.gridSize, ()=>{});
    g.style.pointerEvents='none';
    const flashMs = t.flashMs * settings().showScale;
    let k = 0;
    const flashNext = ()=>{
      if(k >= t.seq.length){
        g.style.pointerEvents='';
        ui.$prompt.innerHTML = `같은 순서로 <b>따라 눌러요</b>`;
        const start = performance.now();
        let pos = 0;
        [...g.children].forEach((c,i)=>{
          c.onclick = ()=>{
            if(i === t.seq[pos]){
              c.classList.add('picked');
              setTimeout(()=>c.classList.remove('picked'), 250);
              pos++;
              if(pos >= t.seq.length) finishTrial(session, ui, true, performance.now()-start);
            } else {
              c.classList.add('wrongpick');
              finishTrial(session, ui, false, performance.now()-start);
            }
          };
        });
        return;
      }
      const c = g.children[t.seq[k]];
      c.classList.add('flash');
      setTimeout(()=>{ c.classList.remove('flash'); k++; setTimeout(flashNext, 180); }, flashMs);
    };
    setTimeout(flashNext, 600);
  },

  cups(session, ui, t){
    ui.$prompt.innerHTML = `공이 <b>어느 컵</b>에 있는지 따라가요`;
    const wrap = el(`<div class="cupwrap"></div>`);
    ui.$stage.append(wrap);
    const W = Math.max(300, Math.min(ui.$stage.clientWidth - 40, 620));
    const slotX = i => Math.round(i * (W - 90) / (t.cups - 1));
    const cups = [];
    for(let i=0;i<t.cups;i++){
      const c = el(`<div class="cup" data-slot="${i}"><span class="ball">⚽</span><span>🥤</span></div>`);
      c.style.left = slotX(i)+'px';
      wrap.append(c); cups.push(c);
    }
    const startCup = cups[t.ballStart];
    startCup.classList.add('lift','showball');
    setTimeout(()=>{
      startCup.classList.remove('lift','showball');
      let s = 0;
      const doSwap = ()=>{
        if(s >= t.swaps.length){
          ui.$prompt.innerHTML = `공이 든 <b>컵을 눌러요!</b>`;
          const start = performance.now();
          cups.forEach(c=>{
            c.onclick = ()=>{
              const slot = +c.dataset.slot;
              const good = slot === t.answerIndex;
              cups.forEach(x=>{ if(+x.dataset.slot === t.answerIndex){ x.classList.add('lift','showball'); }});
              finishTrial(session, ui, good, performance.now()-start);
            };
          });
          return;
        }
        const [i,j] = t.swaps[s];
        const ci = cups.find(c=>+c.dataset.slot===i), cj = cups.find(c=>+c.dataset.slot===j);
        ci.style.left = slotX(j)+'px'; cj.style.left = slotX(i)+'px';
        ci.dataset.slot = j; cj.dataset.slot = i;
        s++;
        setTimeout(doSwap, t.speed);
      };
      setTimeout(doSwap, 400);
    }, 1400 * settings().showScale);
  },

  wordPic(session, ui, t){
    ui.$prompt.innerHTML = `단어를 읽고 <b>알맞은 그림</b>을 골라요`;
    const head = el(`<div style="margin-bottom:18px;display:flex;align-items:center;justify-content:center">
        <span class="answord">${t.word}</span>
        <button class="ttsbtn" title="단어 듣기" aria-label="단어 듣기">🔊</button>
      </div>`);
    head.querySelector('.ttsbtn').addEventListener('click', e=>{ e.stopPropagation(); speak(t.word); });
    ui.$stage.append(head);
    const start = performance.now();
    makeGrid(ui, t.options.map(o=>o.e), t.options.length>4?3:2, (i,c)=>{
      c.classList.add(i===t.answerIndex?'picked':'wrongpick');
      finishTrial(session, ui, i===t.answerIndex, performance.now()-start);
    });
  },

  math(session, ui, t){
    ui.$prompt.innerHTML = `<b>답</b>을 골라요`;
    let line;
    if(t.display.type==='emoji'){
      const {a,b,emoji} = t.display;
      line = el(`<div class="mathline"><span class="emojirow">${emoji.repeat(a)}</span> ＋ <span class="emojirow">${emoji.repeat(b)}</span> ＝ ？</div>`);
    } else {
      line = el(`<div class="mathline">${t.display.text}</div>`);
    }
    ui.$stage.append(line);
    const start = performance.now();
    const g = el(`<div class="optgrid" style="grid-template-columns:repeat(4, minmax(64px,110px))"></div>`);
    t.options.forEach((v,i)=>{
      const c = el(`<button class="cell numopt">${v}</button>`);
      c.addEventListener('click', ()=>{
        c.classList.add(i===t.answerIndex?'picked':'wrongpick');
        finishTrial(session, ui, i===t.answerIndex, performance.now()-start);
      });
      g.append(c);
    });
    ui.$stage.append(g);
  },

  /* ---- PLUS: 보고 말하기 (voice) ---- */
  speak(session, ui, t){
    const isReading = t.mode === 'reading';
    const target = isReading ? t.text : t.word;
    ui.$prompt.innerHTML = isReading ? '문장을 <b>소리 내어 읽어요</b>' : '그림의 이름을 <b>말해 보세요</b>';
    const head = el(`<div class="speakhead">${
      isReading
        ? `<div class="readtext">${t.text}</div><button class="ttsbtn" title="들어보기" aria-label="들어보기">🔊</button>`
        : `<div class="speakpic">${t.emoji}</div>${t.hint?`<div class="speakhint">힌트: <b>${t.hint}</b> ...</div>`:''}`
    }</div>`);
    const tts = head.querySelector('.ttsbtn');
    if(tts) tts.addEventListener('click', e=>{ e.stopPropagation(); speak(target); });
    ui.$stage.append(head);
    const start = performance.now();

    const selfScore = ()=>{
      const row = el(`<div class="rowbtns" style="margin-top:14px">
        <button class="mainbtn" id="okSelf">⭕ 잘 말했어요</button>
        <button class="mainbtn ghost" id="noSelf">❌ 어려웠어요</button>
      </div>`);
      row.querySelector('#okSelf').addEventListener('click', ()=>finishTrial(session, ui, true, performance.now()-start));
      row.querySelector('#noSelf').addEventListener('click', ()=>finishTrial(session, ui, false, performance.now()-start));
      ui.$stage.append(row);
    };

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      ui.$stage.append(el(`<p class="micnote">이 기기에서는 음성 인식이 지원되지 않아요. 크게 말해 본 뒤 직접 채점해요.</p>`));
      selfScore();
      return;
    }
    const micBtn = el(`<button class="micbtn">🎤 눌러서 말하기</button>`);
    const status = el(`<p class="micnote" aria-live="polite"></p>`);
    ui.$stage.append(micBtn, status);
    micBtn.addEventListener('click', ()=>{
      let handled = false;
      let rec;
      try{ rec = new SR(); }catch(e){ micBtn.remove(); status.textContent='음성 인식을 시작하지 못했어요. 직접 채점해 주세요.'; selfScore(); return; }
      rec.lang = 'ko-KR'; rec.interimResults = false; rec.maxAlternatives = 3;
      micBtn.disabled = true; micBtn.textContent = '👂 듣고 있어요...';
      rec.onresult = e=>{
        if(handled) return; handled = true;
        const alts = [...e.results[0]].map(a=>a.transcript);
        const good = alts.some(tr=>CP.matchSpeech(target, tr));
        status.textContent = `들린 말: "${alts[0]}"`;
        finishTrial(session, ui, good, performance.now()-start);
      };
      rec.onerror = ()=>{
        if(handled) return; handled = true;
        micBtn.remove();
        status.textContent = '잘 들리지 않았어요. 직접 채점해 주세요.';
        selfScore();
      };
      rec.onend = ()=>{
        if(!handled){ micBtn.disabled = false; micBtn.textContent = '🎤 다시 말하기'; }
      };
      try{ rec.start(); }catch(e){ rec.onerror(); }
    });
  },

  /* ---- PLUS: 따라 쓰기 (handwriting) ---- */
  trace(session, ui, t){
    ui.$prompt.innerHTML = `흐린 글자를 <b>따라 써요</b>`;
    const W = Math.max(320, Math.min((ui.$stage.clientWidth||600) - 30, 560));
    const H = 240;
    const fs = Math.min(150, Math.floor((W - 40) / t.text.length));
    const font = `${fs}px 'Jua','Gowun Dodum',sans-serif`;
    const start = performance.now();

    const wrap = el(`<div class="tracewrap" style="width:${W}px;height:${H}px">
      <canvas class="tracecv tmpl" width="${W}" height="${H}"></canvas>
      <canvas class="tracecv ink" width="${W}" height="${H}"
        data-text="${t.text}" data-font="${font}" data-cx="${W/2}" data-cy="${H/2}"></canvas>
    </div>`);
    ui.$stage.append(wrap);
    const tcv = wrap.querySelector('.tmpl'), icv = wrap.querySelector('.ink');
    const tctx = tcv.getContext && tcv.getContext('2d');
    const ictx = icv.getContext && icv.getContext('2d');

    if(!tctx || !ictx){ // canvas unavailable → paper fallback with self-scoring
      wrap.remove();
      ui.$stage.append(el(`<div class="readtext" style="margin-bottom:10px">${t.text}</div>`));
      ui.$stage.append(el(`<p class="micnote">이 환경에서는 화면 쓰기가 지원되지 않아요. 종이에 따라 쓴 뒤 직접 채점해요.</p>`));
      const row = el(`<div class="rowbtns" style="margin-top:14px">
        <button class="mainbtn" id="okSelf">⭕ 잘 썼어요</button>
        <button class="mainbtn ghost" id="noSelf">❌ 어려웠어요</button>
      </div>`);
      row.querySelector('#okSelf').addEventListener('click', ()=>finishTrial(session, ui, true, performance.now()-start));
      row.querySelector('#noSelf').addEventListener('click', ()=>finishTrial(session, ui, false, performance.now()-start));
      ui.$stage.append(row);
      return;
    }

    // template glyph (faint)
    tctx.clearRect(0,0,W,H);
    tctx.font = font; tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
    tctx.fillStyle = '#C9D8DD';
    tctx.fillText(t.text, W/2, H/2);

    // ink drawing
    ictx.lineWidth = 14; ictx.lineCap = 'round'; ictx.lineJoin = 'round';
    ictx.strokeStyle = '#0081A7';
    let drawing = false, last = null;
    const pos = e => {
      const r = icv.getBoundingClientRect();
      const sx = r.width ? W / r.width : 1, sy = r.height ? H / r.height : 1;
      return { x:(e.clientX - r.left) * sx, y:(e.clientY - r.top) * sy };
    };
    icv.addEventListener('pointerdown', e=>{ drawing = true; last = pos(e); e.preventDefault(); });
    icv.addEventListener('pointermove', e=>{
      if(!drawing) return;
      const p = pos(e);
      ictx.beginPath(); ictx.moveTo(last.x, last.y); ictx.lineTo(p.x, p.y); ictx.stroke();
      last = p; e.preventDefault();
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>icv.addEventListener(ev, ()=>{ drawing = false; }));

    const maskOf = ctx => {
      const d = ctx.getImageData(0,0,W,H).data;
      const m = new Uint8Array(W*H);
      for(let i=0;i<W*H;i++) if(d[i*4+3] > 40) m[i] = 1;
      return m;
    };
    const row = el(`<div class="rowbtns" style="margin-top:14px">
      <button class="mainbtn ghost" id="clearInk">🧽 다 지우기</button>
      <button class="mainbtn" id="doneInk">✅ 다 썼어요</button>
    </div>`);
    row.querySelector('#clearInk').addEventListener('click', ()=>ictx.clearRect(0,0,W,H));
    row.querySelector('#doneInk').addEventListener('click', ()=>{
      const res = CP.scoreTrace(maskOf(tctx), maskOf(ictx), W, H, 10);
      finishTrial(session, ui, res.pass, performance.now()-start);
    });
    ui.$stage.append(row);
  }
};

/* ==================== REPORT ==================== */

function renderReport(){
  const p = profile();
  $app.innerHTML='';
  const wrap = el(`<div class="report">
    <div class="gamehead">
      <button class="backbtn" id="btnBack">← 홈으로</button>
      <h2 class="gametitle display">📊 리포트 · ${esc(p.name)}</h2>
      <span></span>
    </div>
  </div>`);
  $app.append(wrap);
  wrap.querySelector('#btnBack').addEventListener('click', renderHome);

  if(!p.records.length){
    wrap.append(el(`<div class="empty-report">아직 기록이 없어요.<br>홈에서 게임을 하나 골라 시작해 보세요! 🧩</div>`));
    return;
  }

  // ---- PLUS: daily trend ----
  const daily = CP.dailySummary(p.records);
  const today = fmtDate(new Date()).slice(0,10);
  const todayRow = daily.find(d=>d.day===today);
  wrap.append(el(`<h2>일일 훈련 추이</h2>`));
  const trend = el(`<div class="bars trendbox"></div>`);
  trend.append(el(`<p class="todayline">${todayRow
    ? `오늘은 <b>${todayRow.sessions}회</b> 훈련했고, 정확도는 <b>${todayRow.accuracy}%</b>예요.`
    : '오늘은 아직 훈련 전이에요. 한 게임 해 볼까요?'}</p>`));
  if(daily.length >= 2){
    const pts = daily.slice(-14);
    const CW = 560, CH = 170, padL = 34, padB = 26, padT = 12;
    const x = i => padL + i * (CW - padL - 10) / Math.max(1, pts.length - 1);
    const y = a => padT + (100 - a) * (CH - padT - padB) / 100;
    const poly = pts.map((d,i)=>`${x(i)},${y(d.accuracy)}`).join(' ');
    trend.append(el(`<svg viewBox="0 0 ${CW} ${CH}" class="trendsvg" role="img" aria-label="일일 정확도 추이 그래프">
      ${[0,50,100].map(v=>`<line x1="${padL}" y1="${y(v)}" x2="${CW-10}" y2="${y(v)}" class="grid"/>
        <text x="${padL-6}" y="${y(v)+4}" class="ylbl">${v}</text>`).join('')}
      <polyline points="${poly}" class="trendline"/>
      ${pts.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.accuracy)}" r="5" class="trenddot"/>
        <text x="${x(i)}" y="${CH-6}" class="xlbl">${d.day.slice(5)}</text>`).join('')}
    </svg>`));
  } else {
    trend.append(el(`<p class="micnote" style="margin:8px 0 4px">이틀 이상 훈련하면 날짜별 그래프가 그려져요.</p>`));
  }
  wrap.append(trend);

  const sum = CP.domainSummary(p.records);
  wrap.append(el(`<h2>영역별 정확도</h2>`));
  const bars = el(`<div class="bars"></div>`);
  for(const d of DOMAINS){
    if(!sum[d]) continue;
    bars.append(el(`
      <div class="barrow">
        <span class="lbl">${DOMAIN_ICON[d]} ${d}</span>
        <div class="bartrack"><div class="barfill" style="width:${sum[d].accuracy}%"></div></div>
        <span class="val">${sum[d].accuracy}%</span>
      </div>`));
  }
  wrap.append(bars);

  wrap.append(el(`<h2>칭찬 도장판</h2>`));
  const stamps = p.records.map(r=> r.correct/r.total>=0.8 ? '🏅' : '🌱').join(' ');
  wrap.append(el(`<div class="stampboard">${stamps || '<span class="empty">첫 도장을 모아 보세요!</span>'}</div>`));

  wrap.append(el(`<h2>최근 훈련 기록</h2>`));
  const rows = p.records.slice(-12).reverse().map(r=>`
    <tr><td>${r.date.slice(5)}</td><td>${r.domain}</td><td>${r.game}</td>
    <td>${r.level}단계</td><td>${r.correct}/${r.total}</td>
    <td>${r.avgTime!=null?(r.avgTime/1000).toFixed(1)+'초':'—'}</td></tr>`).join('');
  wrap.append(el(`<table class="sesstable">
    <thead><tr><th>일시</th><th>영역</th><th>게임</th><th>난이도</th><th>정답</th><th>평균반응</th></tr></thead>
    <tbody>${rows}</tbody></table>`));

  const btns = el(`<div class="rowbtns" style="margin-top:20px">
    <button class="mainbtn" id="expCsv">⬇️ CSV 저장 (엑셀용)</button>
    <button class="mainbtn ghost" id="expJson">⬇️ JSON 저장</button>
  </div>`);
  wrap.append(btns);
  wrap.append(el(`<p class="storenote" style="text-align:center;margin-top:12px">${storageNote()}</p>`));
  btns.querySelector('#expCsv').addEventListener('click', ()=>
    download(`코그플레이_${esc(p.name)}_기록_${Date.now()}.csv`, CP.toCSV(p.records), 'text/csv;charset=utf-8'));
  btns.querySelector('#expJson').addEventListener('click', ()=>
    download(`코그플레이_${esc(p.name)}_기록_${Date.now()}.json`,
      JSON.stringify({user:p.name, exported:fmtDate(new Date()), records:p.records}, null, 2),
      'application/json'));
}

/* ---------- boot ---------- */
loadState();
saveState();
renderHome();
window.__CP_STATE__ = state;                 // exposed for automated smoke tests
window.__CP_PROFILE__ = profile;
window.__CP_START__ = id => startSession(GAMES.find(g=>g.id===id));
window.__CP_VIEWS__ = { home:renderHome, report:renderReport, settings:renderSettings };
})();

</script>

<script>

(function(){

  window.__OT_CREDIT__ = true;

  var CFG = window.__OT_CFG__ || {};
