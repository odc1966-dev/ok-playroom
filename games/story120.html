    const STORY = EPISODES.flatMap((episode, index) => [
      {
        text: `${index + 1}화 · ${episode.series}\n${episode.title}`,
        type: "episode",
        episodeIndex: index
      },
      ...episode.lines.map((text) => ({
        text,
        type: "line",
        episodeIndex: index
      }))
    ]);

    const EPISODE_STARTS = EPISODES.map((episode, episodeIndex) =>
      STORY.findIndex((storyItem) => storyItem.episodeIndex === episodeIndex)
    );

    const STORAGE_KEY = "one-line-story-progress-v1";

    const menu = document.getElementById("menu");
    const storyView = document.getElementById("story-view");
    const chat = document.getElementById("chat");
    const resumeButton = document.getElementById("resume-button");
    const resumePrimary = document.getElementById("resume-primary");
    const resumeSecondary = document.getElementById("resume-secondary");
    const seriesView = document.getElementById("series-view");
    const seriesList = document.getElementById("series-list");
    const episodeView = document.getElementById("episode-view");
    const episodeHeading = document.getElementById("episode-heading");
    const episodeList = document.getElementById("episode-list");
    const backToSeries = document.getElementById("back-to-series");
    const openMenuButton = document.getElementById("open-menu");
    const saveNote = document.getElementById("save-note");

    let storyIndex = 0;
    let isFinished = false;

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Number.isInteger(saved.nextIndex)) return 0;
        return Math.min(Math.max(saved.nextIndex, 0), STORY.length);
      } catch (error) {
        saveNote.textContent = "이 브라우저에서는 자동 저장을 사용할 수 없습니다.";
        return 0;
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          nextIndex: storyIndex
        }));
      } catch (error) {
        saveNote.textContent = "이 브라우저에서는 자동 저장을 사용할 수 없습니다.";
      }
    }

    function centerBubble(bubble) {
      bubble.scrollIntoView({
        behavior: "auto",
        block: "center",
        inline: "nearest"
      });
    }

    function addBubble(text, type = "line", shouldCenter = true) {
      const bubble = document.createElement("p");
      bubble.className = "bubble";

      if (type === "episode") bubble.classList.add("episode-title");
      if (type === "end") bubble.classList.add("end-message");

      bubble.textContent = text;
      chat.appendChild(bubble);
      if (shouldCenter) centerBubble(bubble);
      return bubble;
    }

    function createMenuButton(numberText, titleText) {
      const button = document.createElement("button");
      const number = document.createElement("span");
      const title = document.createElement("span");

      button.type = "button";
      button.className = "menu-button";
      number.className = "button-number";
      title.className = "button-title";
      number.textContent = numberText;
      title.textContent = titleText;
      button.append(number, title);
      return button;
    }

    function renderSeriesMenu() {
      const seriesNames = [...new Set(EPISODES.map((episode) => episode.series))];
      seriesList.replaceChildren();

      seriesNames.forEach((seriesName) => {
        const episodeIndexes = EPISODES
          .map((episode, index) => ({ episode, index }))
          .filter((item) => item.episode.series === seriesName)
          .map((item) => item.index);
        const first = episodeIndexes[0] + 1;
        const last = episodeIndexes[episodeIndexes.length - 1] + 1;
        const button = createMenuButton(`${first}화 ~ ${last}화`, seriesName);

        button.setAttribute("aria-label", `${seriesName}, ${first}화부터 ${last}화`);
        button.addEventListener("click", () => showEpisodeMenu(seriesName));
        seriesList.appendChild(button);
      });
    }

    function showEpisodeMenu(seriesName) {
      seriesList.parentElement.hidden = true;
      episodeView.hidden = false;
      episodeHeading.textContent = seriesName;
      episodeList.replaceChildren();

      EPISODES.forEach((episode, index) => {
        if (episode.series !== seriesName) return;

        const button = createMenuButton(`${index + 1}화`, episode.title);
        button.setAttribute("aria-label", `${index + 1}화, ${episode.title} 시작하기`);
        button.addEventListener("click", () => startEpisode(index));
        episodeList.appendChild(button);
      });

      window.scrollTo({ top: 0, behavior: "auto" });
      backToSeries.focus({ preventScroll: true });
    }

    function showSeriesMenu() {
      episodeView.hidden = true;
      seriesView.hidden = false;
      window.scrollTo({ top: 0, behavior: "auto" });
      const firstSeriesButton = seriesList.querySelector("button");
      if (firstSeriesButton) firstSeriesButton.focus({ preventScroll: true });
    }

    function renderResumeButton() {
      const savedIndex = loadProgress();

      if (savedIndex <= 0) {
        resumeButton.hidden = true;
        return;
      }

      resumeButton.hidden = false;

      if (savedIndex >= STORY.length) {
        resumePrimary.textContent = `${EPISODES.length}편을 모두 읽었습니다`;
        resumeSecondary.textContent = "처음부터 다시 읽기";
        return;
      }

      const episodeIndex = STORY[savedIndex].episodeIndex;
      const episode = EPISODES[episodeIndex];
      const positionInEpisode = savedIndex - EPISODE_STARTS[episodeIndex];
      const readLineCount = Math.max(0, positionInEpisode - 1);

      resumePrimary.textContent = positionInEpisode === 0
        ? `${episodeIndex + 1}화부터 이어보기`
        : `${episodeIndex + 1}화 이어보기`;
      resumeSecondary.textContent = positionInEpisode === 0
        ? `${episode.series} · ${episode.title}`
        : `${episode.title} · 본문 ${readLineCount}/3까지 읽음`;
    }

    function showStoryView() {
      menu.hidden = true;
      storyView.hidden = false;
      window.scrollTo({ top: 0, behavior: "auto" });
      storyView.focus({ preventScroll: true });
    }

    function showMainMenu() {
      storyView.hidden = true;
      menu.hidden = false;
      renderResumeButton();
      showSeriesMenu();
    }

    function startEpisode(episodeIndex) {
      storyIndex = EPISODE_STARTS[episodeIndex];
      isFinished = false;
      chat.replaceChildren();
      showStoryView();
      showNextLine();
    }

    function resumeStory() {
      const savedIndex = loadProgress();

      if (savedIndex <= 0 || savedIndex >= STORY.length) {
        startEpisode(0);
        return;
      }

      storyIndex = savedIndex;
      isFinished = false;
      chat.replaceChildren();
      showStoryView();

      const episodeIndex = STORY[storyIndex].episodeIndex;
      const episodeStartIndex = EPISODE_STARTS[episodeIndex];

      if (storyIndex === episodeStartIndex) {
        showNextLine();
        return;
      }

      let lastBubble = null;
      for (let index = episodeStartIndex; index < storyIndex; index += 1) {
        const storyItem = STORY[index];
        lastBubble = addBubble(storyItem.text, storyItem.type, false);
      }

      if (lastBubble) centerBubble(lastBubble);
    }

    function showNextLine() {
      if (isFinished) return;

      if (storyIndex < STORY.length) {
        const storyItem = STORY[storyIndex];
        addBubble(storyItem.text, storyItem.type);
        storyIndex += 1;
        saveProgress();
        return;
      }

      isFinished = true;
      const endText = `${EPISODES.length}개의 이야기가 모두 끝났습니다.`;
      addBubble(endText, "end");
    }

    resumeButton.addEventListener("click", resumeStory);
    backToSeries.addEventListener("click", showSeriesMenu);
    openMenuButton.addEventListener("click", showMainMenu);

    document.addEventListener("click", (event) => {
      if (!menu.hidden || event.target.closest("button")) return;
      showNextLine();
    });

    document.addEventListener("keydown", (event) => {
      if (!menu.hidden || event.repeat || event.target.closest("button")) return;

      const advanceKeys = ["Enter", " ", "ArrowRight", "ArrowDown"];
      if (!advanceKeys.includes(event.key)) return;

      event.preventDefault();
      showNextLine();
    });

    renderSeriesMenu();
    showMainMenu();

  </script>

  /* ── 버튼 ── */
  var bar = document.createElement("div");
  bar.className = "otk-bar";

  var inIframe = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

  if (C.back === "auto") {
    var b = document.createElement("button");
    b.type = "button"; b.className = "otk-btn"; b.setAttribute("aria-label","뒤로");
    b.textContent = "\u2039";                 // ‹
    b.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      /* 런처 안이면 런처 홈으로, 단독 실행이면 앱 자체 첫 화면으로 */
      if (inIframe) { try{ parent.postMessage({__ot:"home"},"*"); }catch(e){} return; }
      if (typeof window.__OT_BACK__ === "function") { window.__OT_BACK__(); return; }
      if (history.length > 1) history.back();
    });
    bar.appendChild(b);
  }

  var i = document.createElement("button");
  i.type = "button"; i.className = "otk-btn"; i.setAttribute("aria-label","앱 정보");
  i.textContent = "i";
  i.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.add("otk-on");
  });
  bar.appendChild(i);

  ov.querySelector(".otk-x").addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    ov.classList.remove("otk-on");
  });

  function mount(){
    document.body.appendChild(bar);
    document.body.appendChild(ov);
  }
  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount);

  /* 반투명 모드에서 한 번 만지면 잠시 또렷해짐 */
  if (C.dim) {
    bar.addEventListener("pointerenter", function(){ bar.classList.add("otk-lit"); });
    bar.addEventListener("pointerdown",  function(){ bar.classList.add("otk-lit");
      setTimeout(function(){ bar.classList.remove("otk-lit"); }, 2500); });
  }
})();
</script>
</body>
</html>
