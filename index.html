<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3EC">
<title>OK Playroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F6F5E'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='900' font-size='26' fill='%23fff' text-anchor='middle'%3EOK%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F6F3EC; --card:#FFFFFF; --ink:#1F2A27; --ink-soft:#5B6863; --line:#E4DED2;
    --brand:#2F6F5E; --brand-soft:#E3EFEA;
    --c-visual:#3E6FB0; --c-switch:#C9772B; --c-motor:#3D8B5A; --c-cog:#7A5BB0; --c-iadl:#B0475B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       -webkit-tap-highlight-color:transparent;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}

  header{display:flex;align-items:center;gap:16px;margin-bottom:22px}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;
        font:900 26px/1 Arial,sans-serif;letter-spacing:-1px;flex:none}
  h1{margin:0;font-size:30px;letter-spacing:-.5px}
  .tag{margin:2px 0 0;color:var(--ink-soft);font-size:16px}

  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
  .chip{min-height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);
        color:var(--ink);font-family:inherit;font-weight:700;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;gap:8px}
  .chip .dot{width:12px;height:12px;border-radius:50%}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  section{margin-bottom:30px}
  section h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:21px}
  section h2 small{font-size:14px;color:var(--ink-soft);font-weight:500}
  section h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--cat);align-self:center}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{display:flex;gap:16px;align-items:center;min-height:112px;padding:18px;border-radius:20px;background:var(--card);
        border:2px solid var(--line);color:inherit;text-decoration:none;position:relative}
  .card:active{transform:scale(.98);border-color:var(--cat)}
  .card:focus-visible{outline:4px solid var(--cat);outline-offset:2px}
  .icon{width:68px;height:68px;border-radius:18px;background:var(--cat-soft);display:grid;place-items:center;font-size:36px;flex:none}
  .card h3{margin:0 0 4px;font-size:19px;letter-spacing:-.3px}
  .card p{margin:0;font-size:14.5px;color:var(--ink-soft)}
  .ext{position:absolute;top:12px;right:14px;font-size:12px;color:var(--ink-soft)}

  footer{margin-top:10px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13.5px;
         display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

  @media (max-width:560px){
    .wrap{padding:20px 16px 32px}
    h1{font-size:25px} .logo{width:54px;height:54px;font-size:22px}
    .chip{min-height:48px;font-size:16px;padding:0 16px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">OK</div>
    <div>
      <h1>OK Playroom</h1>
      <p class="tag">아동·청소년 작업치료 게임 모음 · 치료 목표별로 골라 쓰세요</p>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="치료 목표"></nav>
  <main id="list"></main>

  <footer>
    <span>© 2026 OK · 치료·교육 목적으로만 사용하세요. 무단 재배포를 금합니다.</span>
    <span id="code"></span>
  </footer>
</div>

<script>
const SITE={"name":"OK Playroom","code":"SITE-2610-2VJY"};
const CATEGORIES=[{"id":"visual","name":"시지각·CVI","en":"Visual perception · CVI"},{"id":"switch","name":"원터치 접근·인과관계","en":"Single-switch access · Cause and effect"},{"id":"motor","name":"상지 운동·눈-손 협응","en":"Upper limb · Eye-hand coordination"},{"id":"cog","name":"인지·언어","en":"Cognition · Language"},{"id":"iadl","name":"일상생활 기술","en":"IADL practice"}];
const GAMES=[{"id":"cvi","cat":"visual","icon":"👁️","title":"CVI 통합 치료","desc":"포커스 프레임·화면 터치·네온 파도·이야기 극장·터치 팡팡을 한곳에서","href":"games/cvi.html","external":false},{"id":"story120","cat":"visual","icon":"📖","title":"120개의 한 줄 이야기","desc":"한 줄씩 보고 듣는 짧은 이야기 모음","href":"games/story120.html","external":false},{"id":"hidden","cat":"visual","icon":"🔍","title":"숨은그림찾기","desc":"그림 속에 숨은 물건 찾기","href":"games/hidden.html","external":false},{"id":"workbook","cat":"visual","icon":"✏️","title":"시지각 워크북","desc":"시지각 활동지 (별도 사이트로 열림)","href":"https://odc1966-dev.github.io/visual-perception-workbook/","external":true},{"id":"play","cat":"switch","icon":"🎈","title":"원터치 놀이터","desc":"한 번 터치로 반응을 만드는 놀이","href":"games/play.html","external":false},{"id":"sports","cat":"switch","icon":"⚽","title":"원터치 스포츠","desc":"한 번 터치로 하는 스포츠 게임","href":"games/sports.html","external":false},{"id":"light","cat":"switch","icon":"💡","title":"빛 하나","desc":"터치하면 빛으로 반응하는 활동","href":"games/light.html","external":false},{"id":"speedrush","cat":"switch","icon":"🏎️","title":"Speed Rush","desc":"원터치 레일 레이싱","href":"games/speedrush.html","external":false},{"id":"warp","cat":"switch","icon":"🌌","title":"빛의 질주: 네온 워프","desc":"원터치 워프 러너","href":"games/warp.html","external":false},{"id":"fruit","cat":"motor","icon":"🍉","title":"과일 베기 도장","desc":"화면을 스와이프해서 과일 베기","href":"games/fruit.html","external":false},{"id":"smasher","cat":"motor","icon":"🔨","title":"Magic Smasher Touch","desc":"터치해서 부수는 게임 (파일이 커서 처음 열 때 느릴 수 있음)","href":"games/smasher.html","external":false},{"id":"cogcare","cat":"cog","icon":"🧩","title":"코그케어 통합","desc":"주의·시지각·기억 중심 인지·언어 훈련 19종","href":"games/cogcare/","external":false},{"id":"cogplay","cat":"cog","icon":"🎲","title":"코그플레이 플러스","desc":"인지·언어 훈련 놀이터","href":"games/cogplay.html","external":false},{"id":"kiosk","cat":"iadl","icon":"🍔","title":"나도 주문해!","desc":"키오스크 주문 연습","href":"games/kiosk.html","external":false},{"id":"drive","cat":"iadl","icon":"🚗","title":"한국 도로 주행","desc":"도로 주행 연습","href":"games/drive.html","external":false}];
(function(){
  const COLORS={visual:"--c-visual",switch:"--c-switch",motor:"--c-motor",cog:"--c-cog",iadl:"--c-iadl"};
  const css=getComputedStyle(document.documentElement);
  const color=id=>css.getPropertyValue(COLORS[id]||"--brand").trim();
  const soft=hex=>hex+"1F";   // 12% 투명 배경

  let current="all";
  try{ current=localStorage.getItem("okgr.cat")||"all"; }catch(e){}
  if(current!=="all" && !CATEGORIES.some(c=>c.id===current)) current="all";

  const chips=document.getElementById("chips");
  const list=document.getElementById("list");
  document.getElementById("code").textContent="사이트 배포본 "+SITE.code;

  function chip(id,label){
    const b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed",String(current===id));
    if(id!=="all"){ const d=document.createElement("span"); d.className="dot"; d.style.background=color(id); b.appendChild(d); }
    b.appendChild(document.createTextNode(label));
    b.onclick=()=>{ current=id; try{localStorage.setItem("okgr.cat",id);}catch(e){} render(); };
    return b;
  }

  function card(g){
    const a=document.createElement("a");
    a.className="card"; a.href=g.href;
    if(g.external){ a.target="_blank"; a.rel="noopener"; }
    const c=color(g.cat);
    a.style.setProperty("--cat",c); a.style.setProperty("--cat-soft",soft(c));
    a.innerHTML='<div class="icon" aria-hidden="true"></div><div><h3></h3><p></p></div>'+(g.external?'<span class="ext">새 창 ↗</span>':'');
    a.querySelector(".icon").textContent=g.icon;
    a.querySelector("h3").textContent=g.title;
    a.querySelector("p").textContent=g.desc;
    return a;
  }

  function render(){
    chips.replaceChildren(chip("all","전체 ("+GAMES.length+")"), ...CATEGORIES.map(c=>chip(c.id,c.name)));
    list.replaceChildren();
    CATEGORIES.filter(c=>current==="all"||c.id===current).forEach(c=>{
      const games=GAMES.filter(g=>g.cat===c.id);
      if(!games.length) return;
      const s=document.createElement("section");
      s.style.setProperty("--cat",color(c.id));
      s.innerHTML='<h2><span></span><small></small></h2><div class="grid"></div>';
      s.querySelector("h2 span").textContent=c.name;
      s.querySelector("h2 small").textContent=c.en+" · "+games.length+"개";
      games.forEach(g=>s.querySelector(".grid").appendChild(card(g)));
      list.appendChild(s);
    });
  }
  render();
})();
</script>
</body>
</html>
