<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OK Playroom — 새 주소로 이동</title>
<meta http-equiv="refresh" content="0; url=https://ok-playroom.pages.dev/">
<script>
  // 예전 주소(/ok-playroom/...)의 나머지 경로를 그대로 새 주소로 넘긴다
  var rest = location.pathname.replace(/^\/ok-playroom\/?/, "");
  location.replace("https://ok-playroom.pages.dev/" + rest + location.search + location.hash);
</script>
<style>body{font-family:"Malgun Gothic",system-ui,sans-serif;background:#F6F3EC;color:#1F2A27;display:grid;place-items:center;min-height:90vh;margin:0;text-align:center;padding:16px}a{color:#2F6F5E;font-weight:700}</style>
</head>
<body>
<p>OK Playroom 주소가 바뀌었습니다.<br><a href="https://ok-playroom.pages.dev/">https://ok-playroom.pages.dev</a> 로 이동합니다.</p>
</body>
</html>
